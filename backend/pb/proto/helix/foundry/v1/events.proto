syntax = "proto3";

package helix.foundry.v1;

import "google/protobuf/timestamp.proto";
import "helix/foundry/v1/types.proto";

option go_package = "github.com/helixdb/helix-foundry/backend/pb/gen/go/helix/foundry/v1;foundryv1";

// FoundryEventsService is what Foundry's public door, the foundry-events
// role, calls, as an Actor of SOURCE_EVENT_SOURCE: an event source's sends,
// for the sender holding the send token, and the reminders people ask for on
// the landing page, for the site. It has no REST routes.
service FoundryEventsService {
  // Helix Foundry event sources: connectors of kind events
  rpc SendFoundryEvents(SendFoundryEventsRequest) returns (SendFoundryEventsResponse);
  rpc ValidateFoundryEventSourceToken(ValidateFoundryEventSourceTokenRequest) returns (ValidateFoundryEventSourceTokenResponse);

  // Reminders a person asks for on Foundry's landing page, from a phone, to
  // try Foundry on a computer: the site sends them to the door with its
  // secret, whose SHA-256 the door passes on and the API checks against
  // foundry.reminders.secret_sha256. The foundry-notify-worker sends them.
  rpc CreateFoundryReminder(CreateFoundryReminderRequest) returns (CreateFoundryReminderResponse);
  rpc StopFoundryReminders(StopFoundryRemindersRequest) returns (StopFoundryRemindersResponse);

  // A dashboard's public snapshot, for anyone holding its link: the door
  // passes the link token's SHA-256, never the token. NotFound for a token of
  // no snapshot, an unpublished one, a deleted workspace's, or wherever
  // public links are off.
  rpc GetSharedFoundryDashboard(GetSharedFoundryDashboardRequest) returns (GetSharedFoundryDashboardResponse);

  // A request Slack sent Helix Foundry's Slack app (foundry.slack), as the
  // door took it at /v1/slack/events or /v1/slack/interactivity: its raw
  // body and signature headers, which the door checked only for form and
  // the five-minute window. The API verifies the signature with the app's
  // signing secret, records once what the bot acts on (an event's or a
  // click's own key), and answers what Slack is to be answered, within
  // Slack's three seconds and without calling Slack. A request it can't
  // record is an error, which the door answers 500, so Slack retries an
  // event; Slack never retries a click. Wherever foundry.slack is off,
  // every request is answered 404.
  rpc ReceiveSlackRequest(ReceiveSlackRequestRequest) returns (ReceiveSlackRequestResponse);

  // The minutes of channels whose Slack events the door answered on Slack's
  // last retry without the API taking them (its gate full, or the API
  // failing), so Slack drops them: the door sends what it gathered once a
  // minute. The API records each as a gap of the Slack data connector
  // reading its team, which the backfill reads again within its capped
  // budget, and skips the rest (no live install or feed, ids of no form,
  // foundry.slack.feed off). The door reads them from bodies it couldn't
  // verify, so a forged one only spends its team's gap budget. A store
  // failure is UNAVAILABLE, and the door sends them again.
  //
  // It also takes one signed event at a time: a channel event the door
  // refused on Slack's last retry for room it keeps per address, or before
  // reading its body, which anyone could make it refuse. The API verifies
  // its signature with the app's signing secret, as ReceiveSlackRequest
  // does, and only then records the gap of its team, channel and minute,
  // answering what became of it.
  rpc RecordFoundrySlackFeedGaps(RecordFoundrySlackFeedGapsRequest) returns (RecordFoundrySlackFeedGapsResponse);

  // Helix's Slack relay (foundry.slack.relay): a standalone Foundry install
  // linked to a Helix workspace takes Slack's requests for its Slack teams,
  // and calls Slack as their installs, through the door, bearing its link's
  // hx_rl_ token; the door passes the token's SHA-256, never the token, and
  // checks it first with ValidateFoundryRelayToken. Each method refuses a
  // token of no live link UNAUTHENTICATED; wherever foundry.slack or its
  // relay is off, every method is FAILED_PRECONDITION, reason
  // FOUNDRY_RELAY_DISABLED.
  //
  // The live link a token's hash names, for the door's admission.
  rpc ValidateFoundryRelayToken(ValidateFoundryRelayTokenRequest) returns (ValidateFoundryRelayTokenResponse);
  // Spends the one-time code the site gave the owner's browser
  // (FoundryService.AuthorizeFoundryRelayLink) with its PKCE verifier, once,
  // within ten minutes, and links the install: its token, shown only here.
  // NOT_FOUND for a code absent, expired, spent or another verifier's;
  // PERMISSION_DENIED once the member who authorized it is no longer an
  // owner or admin of the workspace.
  rpc RedeemFoundryRelayCode(RedeemFoundryRelayCodeRequest) returns (RedeemFoundryRelayCodeResponse);
  // Acks what the install took, then waits up to wait_ms for what Slack
  // sent its installs, and leases it: the bot's requests first, then its
  // channel messages (while hosted's foundry.slack.feed or follow is on and
  // the install's feed is). Always answers the link's live installs.
  rpc ClaimFoundryRelayDeliveries(ClaimFoundryRelayDeliveriesRequest) returns (ClaimFoundryRelayDeliveriesResponse);
  // Calls a Slack Web API method as the link's install serving
  // local_workspace_id, within the relay's allowlist and scopes, rewritten
  // as the bot's own calls are; Slack's answer, rid of tokens and of
  // users.info's email and phone. PERMISSION_DENIED for a method, channel or
  // user the relay doesn't allow; RESOURCE_EXHAUSTED never: a call that may
  // not go yet answers retry_after_s.
  rpc CallSlackForRelay(CallSlackForRelayRequest) returns (CallSlackForRelayResponse);
  // Starts adding Helix's Slack app for the install's local workspace: the
  // Slack page to send its owner to, whose answer Helix's site finishes and
  // sends back to return_to, the link's own Settings › Slack.
  rpc StartFoundryRelaySlackInstall(StartFoundryRelaySlackInstallRequest) returns (StartFoundryRelaySlackInstallResponse);
  // Revokes the token's link, from the install's side (its owner unlinked
  // it): its installs leave Slack.
  rpc RevokeFoundryRelayToken(RevokeFoundryRelayTokenRequest) returns (RevokeFoundryRelayTokenResponse);
}

message ValidateFoundryRelayTokenRequest {
  // Lowercase hex SHA-256 of the whole token.
  string token_sha256 = 1;
}
message ValidateFoundryRelayTokenResponse {
  bool valid = 1;
  string link_id = 2;
  string workspace_id = 3;
}

message RedeemFoundryRelayCodeRequest {
  // The code Helix's site handed back to the install's Settings › Slack.
  string code = 1;
  // The PKCE verifier whose S256 challenge the code was authorized for.
  string code_verifier = 2;
}
message RedeemFoundryRelayCodeResponse {
  // The link's hx_rl_ token: Helix keeps only its SHA-256.
  string token = 1;
  string link_id = 2;
  // The Helix workspace the install is linked to, and the email of the
  // member who linked it.
  string workspace_id = 3;
  string account_email = 4;
}

// FoundryRelayFeedOn says whether a local workspace's Slack data connector
// reads its relayed install.
message FoundryRelayFeedOn {
  string local_workspace_id = 1;
  bool on = 2;
}

message ClaimFoundryRelayDeliveriesRequest {
  string token_sha256 = 1;
  // Ids of deliveries and feed items the install took since its last claim:
  // at most 2,048.
  repeated string acks = 2;
  // How long to wait for something: 0 to 20,000, within
  // foundry.slack.relay.claim_wait.
  int32 wait_ms = 3;
  // The most deliveries to lease: 1 to 10; 0 is 10.
  int32 max = 4;
  // Whether each local workspace's Slack data connector reads its install;
  // hosted turns one on only while its own foundry.slack.feed or follow is.
  // Workspaces left out keep what they had.
  repeated FoundryRelayFeedOn feeds = 5;
  // The install's address, as the door's load balancer saw it: kept as the
  // link's last contact.
  string client_address = 6;
}

// FoundryRelayDelivery is a request Slack sent a relayed install, which its
// local install queues as an intake row of the same id and dedupe key.
message FoundryRelayDelivery {
  string id = 1;
  string install_id = 2;
  string local_workspace_id = 3;
  // "event" or "interaction", as the intake's kind.
  string kind = 4;
  string dedupe_key = 5;
  string conversation = 6;
  string slack_user_id = 7;
  // The parsed event or click, as the intake keeps it.
  string payload_json = 8;
}

// FoundryRelayFeedRow is a channel message's buffer row for a relayed
// install's Slack data connector, which its local install appends as it is.
message FoundryRelayFeedRow {
  string id = 1;
  string install_id = 2;
  string local_workspace_id = 3;
  string dedupe_key = 4;
  string channel_id = 5;
  // Its day, midnight UTC.
  google.protobuf.Timestamp day = 6;
  // The buffer row's kind (message, changed, deleted, replied, channel,
  // joined, left, span or complete).
  string kind = 7;
  string payload_json = 8;
}

// FoundryRelayFeedGap is a span of a channel's messages (every channel's,
// for channel_id "") a relayed install may never get: its local install
// records it as a gap of its feed.
message FoundryRelayFeedGap {
  string id = 1;
  string install_id = 2;
  string local_workspace_id = 3;
  string channel_id = 4;
  google.protobuf.Timestamp from = 5;
  google.protobuf.Timestamp to = 6;
}

// FoundryRelayInstall is a live install of Helix's Slack app serving one of
// the link's local workspaces, which its local install mirrors (no token:
// its calls go through the relay).
message FoundryRelayInstall {
  string install_id = 1;
  string local_workspace_id = 2;
  string team_id = 3;
  string enterprise_id = 4;
  string team_name = 5;
  string app_id = 6;
  string bot_user_id = 7;
  string bot_id = 8;
  bool installer_admin = 9;
  repeated string scopes = 10;
  // Who in Slack installed it: the local owner's own Slack account.
  string installed_by_slack_user_id = 11;
  google.protobuf.Timestamp created_at = 12;
  // Hosted holds its channel messages for its local install.
  bool feed_on = 13;
}

message ClaimFoundryRelayDeliveriesResponse {
  // Oldest first, leased for a minute: a delivery not acked by then is
  // claimed again.
  repeated FoundryRelayDelivery deliveries = 1;
  // Channel messages and gaps, oldest first, leased as deliveries are.
  repeated FoundryRelayFeedRow feed = 2;
  repeated FoundryRelayFeedGap feed_gaps = 3;
  // The link's live installs: any other the local install has is gone.
  repeated FoundryRelayInstall installs = 4;
  // How many of acks were taken.
  int32 acked = 5;
  // Hosted's foundry.slack.feed and follow: a local install's own can only
  // narrow them.
  bool hosted_feed = 6;
  bool hosted_follow = 7;
}

message CallSlackForRelayRequest {
  string token_sha256 = 1;
  // The local workspace whose install the call acts as.
  string local_workspace_id = 2;
  // The Web API method, such as chat.postMessage.
  string method = 3;
  // Its arguments, a JSON object: a method Slack takes as a form gets each
  // as a string.
  string body_json = 4;
}
message CallSlackForRelayResponse {
  // Slack's answer, as a JSON object; empty when the call may not go yet.
  string body_json = 1;
  // Set when the call may not go yet (Slack's 429, or the relay's limits):
  // try it again after as many seconds.
  int32 retry_after_s = 2;
}

message StartFoundryRelaySlackInstallRequest {
  string token_sha256 = 1;
  string local_workspace_id = 2;
  // The link's own Settings › Slack, <redirect origin>/settings/slack:
  // anything else is INVALID_ARGUMENT.
  string return_to = 3;
}
message StartFoundryRelaySlackInstallResponse {
  string authorize_url = 1;
}

message RevokeFoundryRelayTokenRequest {
  string token_sha256 = 1;
}
message RevokeFoundryRelayTokenResponse {}

// FoundrySlackFeedGap is one minute of one channel's events Slack dropped.
message FoundrySlackFeedGap {
  // The install's team and Grid org ("" outside one), read from the event
  // as the API reads an event's.
  string team_id = 1;
  string enterprise_id = 2;
  // The channel; "" for every channel the feed reads, when the event named
  // none the door could read.
  string channel_id = 3;
  // The minute's start: the event's event_time, else when the door took it.
  google.protobuf.Timestamp minute = 4;
}

message RecordFoundrySlackFeedGapsRequest {
  // At most 1,000.
  repeated FoundrySlackFeedGap gaps = 1;
  // A channel event the door refused on Slack's last retry before it could
  // be verified, whose gap is recorded only once its signature is.
  FoundrySlackSignedEvent signed = 2;
}
message RecordFoundrySlackFeedGapsResponse {
  // What became of signed's gap; UNSPECIFIED without one.
  SlackSignedGap signed = 1;
}

// FoundrySlackSignedEvent is a request to the events URL as Slack signed it.
message FoundrySlackSignedEvent {
  // The body exactly as Slack sent it: the signature is over these bytes.
  bytes body = 1;
  // X-Slack-Signature and X-Slack-Request-Timestamp.
  string signature = 2;
  string timestamp = 3;
}

// SlackSignedGap is what became of a signed event's gap.
enum SlackSignedGap {
  SLACK_SIGNED_GAP_UNSPECIFIED = 0;
  // Its signature verified, and its gap is recorded (or was already) for
  // the live feed reading its team.
  SLACK_SIGNED_GAP_RECORDED = 1;
  // Its signature verified, but no feed reads it: not a channel event, a
  // channel shared with another organisation, no live install or feed of
  // its team, or foundry.slack.feed off.
  SLACK_SIGNED_GAP_UNREAD = 2;
  // Its signature is false, or its timestamp out of the five-minute window:
  // no gap is recorded.
  SLACK_SIGNED_GAP_UNVERIFIED = 3;
}

// SlackRoute is the door's route a Slack request came to.
enum SlackRoute {
  SLACK_ROUTE_UNSPECIFIED = 0;
  // POST /v1/slack/events: the Events API, a JSON body.
  SLACK_ROUTE_EVENTS = 1;
  // POST /v1/slack/interactivity: clicks, a form whose payload is JSON.
  SLACK_ROUTE_INTERACTIVITY = 2;
}

message ReceiveSlackRequestRequest {
  SlackRoute route = 1;
  // The body exactly as Slack sent it: the signature is over these bytes.
  bytes body = 2;
  // X-Slack-Signature: "v0=" and 64 hex digits.
  string signature = 3;
  // X-Slack-Request-Timestamp: Unix seconds.
  string timestamp = 4;
  // X-Slack-Retry-Num and X-Slack-Retry-Reason, on Slack's retry of an
  // event: 0 and empty on its first delivery.
  int32 retry_num = 5;
  string retry_reason = 6;
}

// ReceiveSlackRequestResponse is the HTTP answer the door gives Slack.
message ReceiveSlackRequestResponse {
  // 200 for every request taken, or one the bot does nothing with; 400 for
  // a body Slack doesn't send; 401 for a signature that doesn't verify; 404
  // wherever foundry.slack is off.
  int32 http_status = 1;
  // The body's media type; empty with no body.
  string content_type = 2;
  // url_verification's challenge, as JSON; empty otherwise.
  bytes body = 3;
}

message GetSharedFoundryDashboardRequest {
  // Lowercase hex SHA-256 of the link's token.
  string token_sha256 = 1;
}
message GetSharedFoundryDashboardResponse {
  // The snapshot as package dashboard writes it (dashboard.Snapshot): no
  // workspace's, ontology's, load's or person's id.
  string snapshot_json = 1;
}

// CreateFoundryReminderRequest starts an address's reminders, or answers
// the schedule it already has.
message CreateFoundryReminderRequest {
  // Lowercase hex SHA-256 of the bearer the site sent the door.
  string secret_sha256 = 1;
  // One plain address, at most 254 characters; kept trimmed and lowercased.
  string email = 2;
  // The IANA time zone the person's browser named, such as Europe/London;
  // a zone Foundry doesn't know is UTC.
  string time_zone = 3;
  // The consent the person agreed to: remind-v1, the site's words "By
  // sending, you're agreeing for us to use your email to remind you about
  // Foundry".
  string consent = 4;
  // Who asked, as the site tells its visitors apart: a key it derives from
  // the visitor's network address with its secret, at most 64 printable
  // ASCII characters, which no one else can link to the address. At most
  // foundry.reminders.max_new_per_client_per_hour schedules start an hour
  // for one client; empty counts toward the hour's cap alone.
  string client = 5;
}
message CreateFoundryReminderResponse {
  // When the address's next reminder goes.
  google.protobuf.Timestamp next_send_at = 1;
  // The address already had a schedule running, which this request left as
  // it was.
  bool again = 2;
}

// StopFoundryRemindersRequest stops an address's reminders: its person has
// signed in to Foundry, so they need no reminder to try it.
message StopFoundryRemindersRequest {
  // Lowercase hex SHA-256 of the bearer the site sent the door.
  string secret_sha256 = 1;
  string email = 2;
}
message StopFoundryRemindersResponse {}

message SendFoundryEventsRequest {
  string workspace_id = 2;
  string connector_id = 3;
  // 16 to 64 bytes, each 0x21-0x7E, new and random for each send (a UUID);
  // optional. A retry with the same token and the same pieces stores nothing
  // and returns the first send (replayed). The same token with other pieces
  // is refused.
  string client_token = 4;
  repeated FoundryEventPiece pieces = 5;
  // An open run of a workflow of the source's workspace to record the send
  // under, with its pieces' ids; empty for none. A replayed send records it
  // once.
  string workflow_run_id = 6;
}
message SendFoundryEventsResponse {
  FoundryEventBatch batch = 1;
  bool replayed = 2;
  // Fields this send added to the source.
  repeated EventSourceField new_fields = 3;
  EventSourceCapacity capacity = 4;
  // Set from 80% full: how full the source is and what happens at 100%.
  string warning = 5;
}
message ValidateFoundryEventSourceTokenRequest {
  // Lowercase hex SHA-256 of the whole token.
  string hash = 2;
}
message ValidateFoundryEventSourceTokenResponse {
  bool valid = 1;
  string token_id = 2;
  string workspace_id = 3;
  string connector_id = 4;
}
