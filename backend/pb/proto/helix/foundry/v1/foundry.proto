      post: "/v1/workspaces/{workspace_id}/foundry/ontologies/{ontology_id}/loads/{id}:stop-enrichment"
      body: "*"
    };
  }

  // The Assistant: a person's conversations with Foundry's own agent, which
  // reads the workspace with Foundry's tools and prepares actions only that
  // person runs, with a click. Each thread and its actions are its user's
  // own: another user's answer NotFound. The UI polls a turn's events as it
  // polls a question's.
  rpc SendFoundryAgentMessage(SendFoundryAgentMessageRequest) returns (FoundryAgentTurnResponse) {
    option (google.api.http) = {
      post: "/v1/workspaces/{workspace_id}/foundry/agent/turns"
      body: "*"
    };
  }
  rpc ListFoundryAgentThreads(ListFoundryAgentThreadsRequest) returns (ListFoundryAgentThreadsResponse) {
    option (google.api.http) = {get: "/v1/workspaces/{workspace_id}/foundry/agent/threads"};
  }
  rpc GetFoundryAgentThread(GetFoundryAgentThreadRequest) returns (FoundryAgentThreadResponse) {
    option (google.api.http) = {get: "/v1/workspaces/{workspace_id}/foundry/agent/threads/{id}"};
  }
  rpc DeleteFoundryAgentThread(DeleteFoundryAgentThreadRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/workspaces/{workspace_id}/foundry/agent/threads/{id}"};
  }
  rpc ListFoundryAgentTurnEvents(ListFoundryAgentTurnEventsRequest) returns (ListFoundryAgentTurnEventsResponse) {
    option (google.api.http) = {get: "/v1/workspaces/{workspace_id}/foundry/agent/turns/{id}/events"};
  }
  rpc CancelFoundryAgentTurn(CancelFoundryAgentTurnRequest) returns (FoundryAgentTurnResponse) {
    option (google.api.http) = {
      post: "/v1/workspaces/{workspace_id}/foundry/agent/turns/{id}:cancel"
      body: "*"
    };
  }
  rpc ExecuteFoundryAgentAction(ExecuteFoundryAgentActionRequest) returns (FoundryAgentActionResponse) {
    option (google.api.http) = {
      post: "/v1/workspaces/{workspace_id}/foundry/agent/actions/{id}:execute"
      body: "*"
    };
  }
  rpc RefreshFoundryAgentAction(RefreshFoundryAgentActionRequest) returns (FoundryAgentActionResponse) {
    option (google.api.http) = {
      post: "/v1/workspaces/{workspace_id}/foundry/agent/actions/{id}:refresh"
      body: "*"
    };
  }
  rpc DismissFoundryAgentAction(DismissFoundryAgentActionRequest) returns (FoundryAgentActionResponse) {
    option (google.api.http) = {
      post: "/v1/workspaces/{workspace_id}/foundry/agent/actions/{id}:dismiss"
      body: "*"
    };
  }

  // Where a local install's Assistant runs its new threads' turns: Foundry's
  // own worker on the workspace's model provider (api), or a helper on the
  // owner's machine driving the Claude Code or Codex CLI they signed in to
  // (claude_code, codex), and the helpers paired with the install. A local
  // install's owner's only: hosted Helix serves none of these
  // (FAILED_PRECONDITION, reason FOUNDRY_AGENT_HOSTS_LOCAL_ONLY).
  rpc GetFoundryAgentRuntime(GetFoundryAgentRuntimeRequest) returns (FoundryAgentRuntimeResponse) {
    option (google.api.http) = {get: "/v1/workspaces/{workspace_id}/foundry/agent/runtime"};
  }
  rpc UpdateFoundryAgentRuntime(UpdateFoundryAgentRuntimeRequest) returns (FoundryAgentRuntimeResponse) {
    option (google.api.http) = {
      patch: "/v1/workspaces/{workspace_id}/foundry/agent/runtime"
      body: "*"
    };
  }
  rpc CreateFoundryAgentHostPairing(CreateFoundryAgentHostPairingRequest) returns (FoundryAgentHostPairingResponse) {
    option (google.api.http) = {
      post: "/v1/workspaces/{workspace_id}/foundry/agent/host-pairings"
      body: "*"
    };
  }
  rpc RevokeFoundryAgentHost(RevokeFoundryAgentHostRequest) returns (FoundryAgentHostResponse) {
    option (google.api.http) = {
      post: "/v1/workspaces/{workspace_id}/foundry/agent/hosts/{id}:revoke"
      body: "*"
    };
  }

  // Dashboards: tiles of typed queries over ontologies' loads (package
  // dashboard), which every member of the workspace sees and reads as
  // themselves through ReadFoundryGraph: a dashboard's page in Foundry is how
  // it is shared inside the workspace. A member creates dashboards and edits
  // and deletes their own while unpinned; owners and admins edit and delete
  // any, pin them in every member's sidebar, and publish one's snapshot at a
  // public link for people outside the workspace (hosted only, with
  // foundry.dashboards.public_enabled, while the workspace has public links
  // on). A grantee of source grants sees the pinned ones and changes none.
  rpc ListFoundryDashboards(ListFoundryDashboardsRequest) returns (ListFoundryDashboardsResponse) {
    option (google.api.http) = {get: "/v1/workspaces/{workspace_id}/foundry/dashboards"};
  }
  rpc GetFoundryDashboard(GetFoundryDashboardRequest) returns (FoundryDashboardResponse) {
    option (google.api.http) = {get: "/v1/workspaces/{workspace_id}/foundry/dashboards/{id}"};
  }
  rpc CreateFoundryDashboard(CreateFoundryDashboardRequest) returns (FoundryDashboardResponse) {
    option (google.api.http) = {
      post: "/v1/workspaces/{workspace_id}/foundry/dashboards"
      body: "*"
    };
  }
  rpc UpdateFoundryDashboard(UpdateFoundryDashboardRequest) returns (FoundryDashboardResponse) {
    option (google.api.http) = {
      patch: "/v1/workspaces/{workspace_id}/foundry/dashboards/{id}"
      body: "*"
    };
  }
  rpc DeleteFoundryDashboard(DeleteFoundryDashboardRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/workspaces/{workspace_id}/foundry/dashboards/{id}"};
  }
  rpc PinFoundryDashboard(PinFoundryDashboardRequest) returns (FoundryDashboardResponse) {
    option (google.api.http) = {
      post: "/v1/workspaces/{workspace_id}/foundry/dashboards/{id}:pin"
      body: "*"
    };
  }
  rpc AddFoundryDashboardQuestionVisual(AddFoundryDashboardQuestionVisualRequest) returns (FoundryDashboardResponse) {
    option (google.api.http) = {
      post: "/v1/workspaces/{workspace_id}/foundry/dashboards/{id}:add-question-visual"
      body: "*"
    };
  }
  rpc PreviewFoundryDashboardTile(PreviewFoundryDashboardTileRequest) returns (PreviewFoundryDashboardTileResponse) {
    option (google.api.http) = {
      post: "/v1/workspaces/{workspace_id}/foundry/dashboards:preview-tile"
      body: "*"
    };
  }
  rpc PublishFoundryDashboard(PublishFoundryDashboardRequest) returns (FoundryDashboardResponse) {
    option (google.api.http) = {
      post: "/v1/workspaces/{workspace_id}/foundry/dashboards/{id}:publish"
      body: "*"
    };
  }
  rpc UnpublishFoundryDashboard(UnpublishFoundryDashboardRequest) returns (FoundryDashboardResponse) {
    option (google.api.http) = {
      post: "/v1/workspaces/{workspace_id}/foundry/dashboards/{id}:unpublish"
      body: "*"
    };
  }
  // The workspace's dashboard settings: whether its dashboards may be
  // published at public links. Any member reads them (a grantee doesn't);
  // only an owner changes them.
  rpc GetFoundryDashboardSettings(GetFoundryDashboardSettingsRequest) returns (FoundryDashboardSettingsResponse) {
    option (google.api.http) = {get: "/v1/workspaces/{workspace_id}/foundry/dashboard-settings"};
  }
  rpc UpdateFoundryDashboardSettings(UpdateFoundryDashboardSettingsRequest) returns (FoundryDashboardSettingsResponse) {
    option (google.api.http) = {
      patch: "/v1/workspaces/{workspace_id}/foundry/dashboard-settings"
      body: "*"
    };
  }

  // Automations (package automation): a person's graph of steps, WHEN its
  // trigger fires (a schedule, or a sync, load, upload or draft that ended)
  // THEN Assistant steps, approved actions, conditions and emails, run as
  // that person, its owner. Every member sees every automation of the
  // workspace and creates their own; only its owner edits, approves, resumes
  // and runs one, as it runs as them; its owner or an owner or admin pauses,
  // deletes and cancels a run. An automation runs only once its owner
  // approved its spec in Foundry (ApproveFoundryAutomation, which the MCP
  // never calls: an agent's create or edit waits for the person's click). A
  // grantee of source grants, a service key and an agent see none. Off
  // (foundry.automations.enabled false) every route is FAILED_PRECONDITION,
  // reason FOUNDRY_AUTOMATIONS_DISABLED.
  rpc ListFoundryAutomations(ListFoundryAutomationsRequest) returns (ListFoundryAutomationsResponse) {
    option (google.api.http) = {get: "/v1/workspaces/{workspace_id}/foundry/automations"};
  }
  rpc GetFoundryAutomation(GetFoundryAutomationRequest) returns (FoundryAutomationResponse) {
    option (google.api.http) = {get: "/v1/workspaces/{workspace_id}/foundry/automations/{id}"};
  }
  rpc CreateFoundryAutomation(CreateFoundryAutomationRequest) returns (FoundryAutomationResponse) {
    option (google.api.http) = {
      post: "/v1/workspaces/{workspace_id}/foundry/automations"
      body: "*"
    };
  }
  rpc UpdateFoundryAutomation(UpdateFoundryAutomationRequest) returns (FoundryAutomationResponse) {
    option (google.api.http) = {
      patch: "/v1/workspaces/{workspace_id}/foundry/automations/{id}"
      body: "*"
    };
  }
  rpc DeleteFoundryAutomation(DeleteFoundryAutomationRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/workspaces/{workspace_id}/foundry/automations/{id}"};
  }
  rpc ApproveFoundryAutomation(ApproveFoundryAutomationRequest) returns (FoundryAutomationResponse) {
    option (google.api.http) = {
      post: "/v1/workspaces/{workspace_id}/foundry/automations/{id}:approve"
      body: "*"
    };
  }
  rpc PauseFoundryAutomation(PauseFoundryAutomationRequest) returns (FoundryAutomationResponse) {
    option (google.api.http) = {
      post: "/v1/workspaces/{workspace_id}/foundry/automations/{id}:pause"
      body: "*"
    };
  }
  rpc ResumeFoundryAutomation(ResumeFoundryAutomationRequest) returns (FoundryAutomationResponse) {
    option (google.api.http) = {
      post: "/v1/workspaces/{workspace_id}/foundry/automations/{id}:resume"
      body: "*"
    };
  }
  rpc RunFoundryAutomation(RunFoundryAutomationRequest) returns (FoundryAutomationRunResponse) {
    option (google.api.http) = {
      post: "/v1/workspaces/{workspace_id}/foundry/automations/{id}:run"
      body: "*"
    };
  }
  rpc ListFoundryAutomationRuns(ListFoundryAutomationRunsRequest) returns (ListFoundryAutomationRunsResponse) {
    option (google.api.http) = {get: "/v1/workspaces/{workspace_id}/foundry/automations/{automation_id}/runs"};
  }
  rpc GetFoundryAutomationRun(GetFoundryAutomationRunRequest) returns (FoundryAutomationRunResponse) {
    option (google.api.http) = {get: "/v1/workspaces/{workspace_id}/foundry/automations/{automation_id}/runs/{id}"};
  }
  rpc CancelFoundryAutomationRun(CancelFoundryAutomationRunRequest) returns (FoundryAutomationRunResponse) {
    option (google.api.http) = {
      post: "/v1/workspaces/{workspace_id}/foundry/automations/{automation_id}/runs/{id}:cancel"
      body: "*"
    };
  }
  // Suggestions for Founder, written for one ontology's current version:
  // prompts of four kinds (2 questions, 2 dashboards, 2 changes to the
  // ontology and 4 workflows, in that order) that fill a composer for the
  // person to edit and send, never run: Founder's new chat shows each
  // kind's first 2 as cards, the new workflow page the workflows. Founder
  // writes them once per version in one call, on the workspace's cheapest
  // task model (the AI setting's extraction model), charged to its monthly
  // budget. Each kind is filled to its count, in order, from: questions,
  // the version's competency questions, then the model's; dashboards and
  // workflows, the model's, then the competency questions'; changes to the
  // ontology, its open audit findings and the connections and document sets
  // it doesn't read, then the model's; then fixed examples. So until
  // Founder has written them (generating), and where it can't (no AI
  // provider, Founder off, its budget or the workspace's 20 writes an hour
  // spent, a failure), every kind still has its count. Without a current
  // version, every kind is fixed examples. Workflows are left out where the
  // deployment has none. Any signed-in member may read them (a grantee may
  // not); an ontology the workspace hasn't is NOT_FOUND.
  rpc ListFoundryAutomationSuggestions(ListFoundryAutomationSuggestionsRequest) returns (ListFoundryAutomationSuggestionsResponse) {
    option (google.api.http) = {get: "/v1/workspaces/{workspace_id}/foundry/automation-suggestions"};
  }

  // Helix Foundry usage: the workspace's AI spend this month, by task
  //
  // The UTC calendar month's spend of loads, of API sources' extraction no
  // person started, and of questions, each with its cap: the sums the caps
  // check. Spend on the workspace's own model key counts, as Helix's monthly
  // caps count it. Any member may read it.
  rpc GetFoundryUsage(GetFoundryUsageRequest) returns (FoundryUsageResponse) {
    option (google.api.http) = {get: "/v1/workspaces/{workspace_id}/foundry/usage"};
  }

  // Helix Foundry People enrichment
  rpc GetFoundryEnrichment(GetFoundryEnrichmentRequest) returns (FoundryEnrichmentResponse) {
    option (google.api.http) = {get: "/v1/workspaces/{workspace_id}/foundry/enrichment"};
  }
  rpc UpdateFoundryEnrichment(UpdateFoundryEnrichmentRequest) returns (FoundryEnrichmentResponse) {
    option (google.api.http) = {
      patch: "/v1/workspaces/{workspace_id}/foundry/enrichment"
      body: "*"
    };
  }

  // Helix Foundry model providers
  rpc GetFoundryAI(GetFoundryAIRequest) returns (FoundryAIResponse) {
    option (google.api.http) = {get: "/v1/workspaces/{workspace_id}/foundry/ai"};
  }
  rpc UpdateFoundryAI(UpdateFoundryAIRequest) returns (FoundryAIResponse) {
    option (google.api.http) = {
      put: "/v1/workspaces/{workspace_id}/foundry/ai"
      body: "*"
    };
  }
  // A local install's only (FAILED_PRECONDITION elsewhere): looks again for
  // the install's default on its machine (FoundryAI.detected), as Settings ›
  // AI models opens, so a model pulled since is used without a restart.
  rpc DetectFoundryAIDefault(DetectFoundryAIDefaultRequest) returns (FoundryAIResponse) {
    option (google.api.http) = {
      post: "/v1/workspaces/{workspace_id}/foundry/ai/detect"
      body: "*"
    };
  }
  // A local install's only (FAILED_PRECONDITION elsewhere): the models an
  // Ollama server has, for the Ollama card's model choice.
  rpc ListFoundryOllamaModels(ListFoundryOllamaModelsRequest) returns (ListFoundryOllamaModelsResponse) {
    option (google.api.http) = {get: "/v1/workspaces/{workspace_id}/foundry/ai/ollama-models"};
  }

  // Helix Foundry source grants. An owner or admin grants a principal (a
  // user, a team, or a service credential: an agent's key) the workspace's
  // sources; a principal the front end's own permissions don't admit reads an
  // ontology's current load, and asks it questions, only while every source
  // that load holds is granted to it (SOURCE_GRANTEE, actor.proto). A
  // workspace that grants nothing behaves as it did without them. A member
  // given any, or on a team given any, is restricted to them, and stays so
  // once they're taken away, until someone lifts it.
  //
  // Every grant, and what each ontology's current load holds and who may
  // read it through grants.
  rpc ListFoundryAccess(ListFoundryAccessRequest) returns (ListFoundryAccessResponse) {
    option (google.api.http) = {get: "/v1/workspaces/{workspace_id}/foundry/access"};
  }
  // Replaces one principal's grants. Giving a member or a team any restricts
  // that member or the team's members: FAILED_PRECONDITION for an owner or
  // admin, or a member (of the team too) holding project write or query scope,
  // which reads the database outside Foundry.
  rpc SetFoundryAccessGrants(SetFoundryAccessGrantsRequest) returns (SetFoundryAccessGrantsResponse) {
    option (google.api.http) = {
      put: "/v1/workspaces/{workspace_id}/foundry/access/grants"
      body: "*"
    };
  }
  // Who would stop reading which ontologies through grants after a change:
  // loading or making current a version, deleting a connector, or moving a
  // document to another set. The site asks before it makes one.
  rpc PreviewFoundryAccessChange(PreviewFoundryAccessChangeRequest) returns (PreviewFoundryAccessChangeResponse) {
    option (google.api.http) = {
      post: "/v1/workspaces/{workspace_id}/foundry/access:preview"
      body: "*"
    };
  }
  // What the caller reads through grants: whether it came as a grantee, and
  // the ontologies its grants cover.
  rpc GetMyFoundryAccess(GetMyFoundryAccessRequest) returns (GetMyFoundryAccessResponse) {
    option (google.api.http) = {get: "/v1/workspaces/{workspace_id}/foundry/access/me"};
  }
  // Restricts a member to what grants give, or lifts it. A restricted
  // member is a grantee on every Foundry call while their role is member:
  // they see only the ontologies their grants cover, and change nothing.
  // Only a plain member holding no project write or query scope can be
  // restricted (FAILED_PRECONDITION otherwise): either reads the database
  // outside Foundry. Holding sources, their own or a team's, is what restricts
  // a member, so it can't be lifted until those are gone (FAILED_PRECONDITION).
  rpc SetFoundryMemberRestricted(SetFoundryMemberRestrictedRequest) returns (SetFoundryMemberRestrictedResponse) {
    option (google.api.http) = {
      put: "/v1/workspaces/{workspace_id}/foundry/access/members/{user_id}"
      body: "*"
    };
  }
  // Teams of the workspace's members, which hold grants for them.
  rpc CreateFoundryTeam(CreateFoundryTeamRequest) returns (FoundryTeamResponse) {
    option (google.api.http) = {
      post: "/v1/workspaces/{workspace_id}/foundry/access/teams"
      body: "*"
    };
  }
  // Renames a team and replaces its members. Whoever joins a team holding
  // grants is restricted to them (FAILED_PRECONDITION for one holding project
  // write or query scope), and whoever leaves stays restricted.
  rpc UpdateFoundryTeam(UpdateFoundryTeamRequest) returns (FoundryTeamResponse) {
    option (google.api.http) = {
      put: "/v1/workspaces/{workspace_id}/foundry/access/teams/{team_id}"
      body: "*"
    };
  }
  // Deletes a team with its grants.
  rpc DeleteFoundryTeam(DeleteFoundryTeamRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/workspaces/{workspace_id}/foundry/access/teams/{team_id}"};
  }
}

// GetFoundryUsageRequest reads the workspace's AI spend this calendar month
// (UTC) by task, with each task's cap; any member may read it, as every
// member sees the questions budget.
message GetFoundryUsageRequest {
  string workspace_id = 1;
}
message FoundryUsageResponse {
  FoundryUsage usage = 1;
}

// GetFoundryEnrichmentRequest reads the workspace's People enrichment
// setting and month; any member may read it.
message GetFoundryEnrichmentRequest {
  string workspace_id = 1;
}

// UpdateFoundryEnrichmentRequest records an owner's change, kept as history
// with the notice they were shown. Turning it on needs Helix's flag
// (FAILED_PRECONDITION) and Foundry Pro (FAILED_PRECONDITION, reason
// FOUNDRY_PRO_REQUIRED); turning it off is always allowed: running lookups
// are cancelled, stored profiles deleted, and each ontology whose loads
// applied some is loaded again without them.
message UpdateFoundryEnrichmentRequest {
  string workspace_id = 1;
  bool enabled = 2;
  // At most 100,000.
  int64 monthly_credit_cap = 3;
  // The notice the owner was shown.
  string notice_version = 4;
}
message FoundryEnrichmentResponse {
  FoundryEnrichment enrichment = 1;
}

// StopFoundryLoadEnrichmentRequest stops a load's lookups: a queued step
// ends at once, a running one after its batch; the load then applies what
// was found. NOT_FOUND when the load has no step.
message StopFoundryLoadEnrichmentRequest {
  string workspace_id = 1;
  string ontology_id = 2;
  string id = 3;
}

// GetFoundryAIRequest reads where the workspace's model calls go; any
// member may read it.
message GetFoundryAIRequest {
  string workspace_id = 1;
}

// UpdateFoundryAIRequest is an owner's change: back to the default at once,
// or a provider saved and tested before it is used (FoundryAI.pending);
// the setting in force stays until the test passes. Bringing a key needs
// Foundry Pro or Max when hosted (FAILED_PRECONDITION, reason
// FOUNDRY_PRO_REQUIRED); a model Helix can't price needs rates
// (FAILED_PRECONDITION, reason FOUNDRY_AI_PRICE_REQUIRED); saves are capped
// per hour (RESOURCE_EXHAUSTED).
message UpdateFoundryAIRequest {
  string workspace_id = 1;
  oneof choice {
    google.protobuf.Empty use_default = 2;
    FoundryAIProvider provider = 3;
  }
  // Unset models get the kind's suggestions.
  FoundryAIModels models = 4;
  // Blank keeps the setting's key where it still belongs to the endpoint.
  string api_key = 5 [debug_redact = true];
}
message FoundryAIResponse {
  FoundryAI ai = 1;
}

// DetectFoundryAIDefaultRequest looks again for a local install's default;
// it answers the workspace's AI settings, as GetFoundryAI does. FAILED_PRECONDITION
// where the install names its default (FOUNDRY_AI_PROVIDER).
message DetectFoundryAIDefaultRequest {
  string workspace_id = 1;
}

// ListFoundryOllamaModelsRequest reads an Ollama server's models.
message ListFoundryOllamaModelsRequest {
  string workspace_id = 1;
  // The server's address, as FoundryAIOllama.base_url.
  string base_url = 2;
}
message ListFoundryOllamaModelsResponse {
  FoundryOllamaServer server = 1;
}

message GetFoundryPlanRequest {
  string workspace_id = 1;
}
message FoundryPlanResponse {
  FoundryPlan plan = 1;
}
message CreateFoundryProCheckoutRequest {
  string workspace_id = 1;
  // Per-click token. Two calls carrying the same token are one purchase.
  string client_token = 2;
  // Stripe promotion code the customer typed; optional.
  string promo_code = 3;
  // The tier to buy: FOUNDRY_TIER_PRO when unset, or FOUNDRY_TIER_MAX.
  // Asking for the tier already held returns the plan and charges nothing;
  // asking for the other paid tier switches to it.
  FoundryTier tier = 4;
  // A catalog plan's code, from ListFoundryPlans; wins over tier when set.
  string plan_code = 5;
}
message ListFoundryPlansRequest {
  string workspace_id = 1;
}
message ListFoundryPlansResponse {
  // In rank order, Free first.
  repeated FoundryCatalogPlan plans = 1;
}
message CreateFoundryProCheckoutResponse {
  // The checkout page to send the customer to; empty when the billing system
  // charged a card on file.
  string checkout_url = 1;
  // The plan now. It can read FREE for a moment after a charge; read
  // GetFoundryPlan again.
  FoundryPlan plan = 2;
}
message CancelFoundryProRequest {
  string workspace_id = 1;
}
message ResumeFoundryProRequest {
  string workspace_id = 1;
}

message ListConnectorKindsRequest {
  string workspace_id = 1;
}
message ListConnectorKindsResponse {
  repeated ConnectorKind kinds = 1;
}
message TestConnectorRequest {
  string workspace_id = 1;
  ConnectorConfig config = 2;
}
message TestConnectorResponse {
  ConnectorDiscovery discovery = 1;
  // The settings as they would be stored, write-only fields empty.
  ConnectorConfig config = 2;
}
message CreateConnectorRequest {
  string workspace_id = 1;
  string name = 2;
  ConnectorConfig config = 3;
}

// ConnectorResponse carries discovery only when the call tested the credential.
message ConnectorResponse {
  Connector connector = 1;
  ConnectorDiscovery discovery = 2;
}

message StartConnectorSignInRequest {
  string workspace_id = 1;
  string kind = 2;
  string name = 3;
  // The connector's settings; its credential fields must be empty.
  ConnectorConfig config = 4;
  // Sign this connector in again instead of making one.
  string connector_id = 5;
  // Makes a retry return the sign-in the first attempt started.
  string client_token = 6;
}
message GetConnectorSignInRequest {
  string workspace_id = 1;
  string id = 2;
}
message AuthorizeConnectorSignInRequest {
  string workspace_id = 1;
  string id = 2;
  // The site's callback; one of foundry.connectors.sign_in_return_to.
  string return_to = 3;
}
message AuthorizeConnectorSignInResponse {
  // The provider's authorization page, for the user's browser.
  string url = 1;
}
message FinishConnectorSignInRequest {
  string workspace_id = 1;
  string id = 2;
  // The connect_code the callback was given.
  string connect_code = 3;
  // The callback's error when it was given no code, such as access_denied.
  string error = 4;
}
message ConnectorSignInResponse {
