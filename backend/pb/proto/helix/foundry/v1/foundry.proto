  repeated FoundryQuestionEvent events = 1;
  // The question's status when read: once it is not queued or running and
  // the events reach last_seq, none follows.
  string status = 2;
  int32 last_seq = 3;
}

// CancelFoundryQuestionRequest ends a queued or running question; a running
// one is charged what it reserved. One that ended otherwise is
// FAILED_PRECONDITION.
message CancelFoundryQuestionRequest {
  string workspace_id = 1;
  string ontology_id = 2;
  string id = 3;
}

// DeleteFoundryLoadRequest deletes a ready, partial, failed or delete_failed
// load from the database in the background; it is deleting until then.
// Deleting a load's nodes also deletes the edges anyone attached to them.
// The current load, or one a job is writing, is FAILED_PRECONDITION.
message DeleteFoundryLoadRequest {
  string workspace_id = 1;
  string ontology_id = 2;
  string id = 3;
}

// ReadFoundryGraphRequest reads a load of the ontology's database: entities
// with the facts its version's rules derive, patterns, explanations ("why"),
// rule breaks and evidence. reads_json is a JSON array of 1 to 20 reads, each
// the `reads` item of the ontology agent's read_request.json. NOT_FOUND for a
// load of another ontology or one deleted; FAILED_PRECONDITION while it is
// being deleted; RESOURCE_EXHAUSTED while the workspace has as many reads
// running as it may.
message ReadFoundryGraphRequest {
  string workspace_id = 1;
  string ontology_id = 2;
  string load_id = 3;
  string reads_json = 4;
  // An open run of a workflow of this ontology to record the read under,
  // with its result; empty for none. NOT_FOUND for a run the ontology has
  // not, FAILED_PRECONDITION for one that finished.
  string workflow_run_id = 5;
}

// ReadFoundryGraphResponse is the agent's ReadResult (read_result.json): one
// result per read, in order, each its value or its own error.
message ReadFoundryGraphResponse {
  string result_json = 1;
}

// Reads the current load's review and stores a decision. A resolve decision
// applies from the next load; a release or a prop decision applies to the
// current load at once (FoundryReviewChoice.release, FoundryReviewChoice.prop);
// a reject changes no load (FoundryReviewChoice.reject).
message SettleFoundryReviewRequest {
  string workspace_id = 1;
  string ontology_id = 2;
  string review_id = 3;
  FoundryReviewChoice decision = 4;
  // How the review queue showed the card the decision was made on: "ranked"
  // (in its order of facts written) or "random" (its random slice, which
  // measures precision); empty for a decision made elsewhere. A release or
  // reject drawn at random is also kept as a label of the claim
  // (FoundryReviewLabel), with the score it was read at.
  string drawn = 5;
}
message FoundryReviewDecisionResponse {
  FoundryReviewDecision decision = 1;
}
message ListFoundryReviewsRequest {
  string workspace_id = 1;
  string ontology_id = 2;
  // Only these reviews, at most 50, each listed once if the current load
  // holds it; never with page_token.
  repeated string review_keys = 3;
  // The next_page_token of a previous page, of the load still current:
  // FAILED_PRECONDITION once another load became current.
  string page_token = 4;
}
message ListFoundryReviewsResponse {
  // The current load the reviews are of.
  string load_id = 1;
  repeated FoundryReview reviews = 2;
  // Set while more reviews follow, up to the 10,000th.
  string next_page_token = 3;
}
message ListFoundryReviewDecisionsRequest {
  string workspace_id = 1;
  string ontology_id = 2;
  // Last decision id from a previous page.
  string page_token = 3;
  // Also list the current load's withdraws, approvals taken back from it
  // (contract 4.16.0, kind withdraw), with what became of each. A client
  // before them leaves it unset and gets none: it has no way to show one.
  bool include_withdraws = 4;
}
message ListFoundryReviewDecisionsResponse {
  repeated FoundryReviewDecision decisions = 1;
  string next_page_token = 2;
}

// Removes a saved decision. A prop decision is withdrawn from the current
// load at once: a job sends the load its value decisions without it, and the
// property goes back to what its other statements give. A release the load
// has not written is taken back from it; one it wrote stays a fact until a
// new load. A resolve stops applying from the next load.
message DeleteFoundryReviewDecisionRequest {
  string workspace_id = 1;
  string ontology_id = 2;
  string id = 3;
}
message DeleteFoundryReviewDecisionResponse {}

// A label of a claim at its place, drawn at random (`fact`, a fact's quote
// the current load holds; `review_id`, a held claim of the current load
// someone has decided) or a second person's re-check (`decision_id`, a
// decision on a held claim; `label_id`, another person's label drawn at
// random). The backend reads the claim from the current load, the decision
// or the label, never from the request.
message SettleFoundryReviewLabelRequest {
  string workspace_id = 1;
  string ontology_id = 2;
  oneof subject {
    FoundryLabelFact fact = 3;
    string decision_id = 4;
    string review_id = 7;
    string label_id = 8;
  }
  // "right" or "wrong".
  string verdict = 5;
  // "random" (a card of the queue's random slice) or "recheck" (a second
  // person's word, never the first person's own).
  string drawn = 6;
}
// An accepted fact's quote in the current load: its document, its section
// and byte range there, and its fact's key.
message FoundryLabelFact {
  string doc_id = 1;
  uint32 section = 2;
  uint32 start = 3;
  uint32 end = 4;
  string fact_key = 5;
}
message FoundryReviewLabelResponse {
  FoundryReviewLabel label = 1;
}
message ListFoundryReviewLabelsRequest {
  string workspace_id = 1;
  string ontology_id = 2;
  // Last label id from a previous page.
  string page_token = 3;
}
message ListFoundryReviewLabelsResponse {
  repeated FoundryReviewLabel labels = 1;
  string next_page_token = 2;
}

// ListFoundryAccessRequest reads the workspace's grants.
message ListFoundryAccessRequest {
  string workspace_id = 1;
}
message ListFoundryAccessResponse {
  // Every grant, oldest first.
  repeated FoundryAccessGrant grants = 1;
  // Each live ontology with a current load: what it holds, and who reads it
  // through grants.
  repeated FoundryOntologyAccess ontologies = 2;
  // The workspace's teams, by name.
  repeated FoundryTeam teams = 3;
  // The members restricted to what grants give.
  repeated string restricted_user_ids = 4;
  // The principals whose Workflows permission is off; every other principal
  // has it on. A member is refused it while they or any of their teams has it
  // off.
  repeated FoundryPrincipal workflows_off = 5;
}

// SetFoundryAccessGrantsRequest replaces a principal's grants with targets,
// none to take them all away. Every target must be of a live connector or
// set of the workspace (NOT_FOUND otherwise).
message SetFoundryAccessGrantsRequest {
  string workspace_id = 1;
  FoundryPrincipal principal = 2;
  repeated FoundryAccessTarget targets = 3;
  // The principal's Workflows permission: on, it lists the workflows of the
  // ontologies it reads and records its own runs, and reads every run of an
  // ontology whose current load it holds all of, else only the runs it
  // started. Absent leaves it as it is (on, unless turned off).
  optional bool workflows = 4;
}
message SetFoundryAccessGrantsResponse {
  // The principal's grants now.
  repeated FoundryAccessGrant grants = 1;
  // The principal's Workflows permission now.
  bool workflows = 2;
}

// PreviewFoundryAccessChangeRequest asks what a change would take away.
message PreviewFoundryAccessChangeRequest {
  string workspace_id = 1;
  FoundryAccessChange change = 2;
}

// FoundryAccessChange is one change the site warns about.
message FoundryAccessChange {
  // A load of an ontology's version, or making it current.
  message LoadVersion {
    string ontology_id = 1;
    string version_id = 2;
  }
  // A document moved to another set.
  message MoveDocument {
    string document_id = 1;
    string document_set_id = 2;
  }
  oneof change {
    LoadVersion load_version = 1;
    string delete_connector = 2;
    MoveDocument move_document = 3;
  }
}
message PreviewFoundryAccessChangeResponse {
  // Each principal that reads an ontology through grants now and wouldn't
  // after the change.
  repeated FoundryAccessLoss losses = 1;
}

// GetMyFoundryAccessRequest reads what the caller reads through grants.
message GetMyFoundryAccessRequest {
  string workspace_id = 1;
}
message GetMyFoundryAccessResponse {
  // The call came as a grantee: the caller reads only through grants.
  bool grantee = 1;
  // The caller holds grants, through itself or its teams.
  bool has_grants = 2;
  // The live ontologies whose current loads its grants hold any of.
  repeated string ontology_ids = 3;
  // Those of them it holds only some of.
  repeated string partial_ontology_ids = 4;
  // The caller may use the workflows of the ontologies it reads: always, for
  // a caller that isn't a grantee; for a grantee, while its Workflows
  // permission is on.
  bool workflows = 5;
}

// SetFoundryMemberRestrictedRequest restricts user_id, or lifts it.
message SetFoundryMemberRestrictedRequest {
  string workspace_id = 1;
  string user_id = 2;
  bool restricted = 3;
}
message SetFoundryMemberRestrictedResponse {
  bool restricted = 1;
}

// CreateFoundryTeamRequest makes a team of members. Names are unique in the
// workspace (ALREADY_EXISTS otherwise), 1 to 120 characters.
message CreateFoundryTeamRequest {
  string workspace_id = 1;
  string name = 2;
  repeated string member_user_ids = 3;
}
message UpdateFoundryTeamRequest {
  string workspace_id = 1;
  string team_id = 2;
  string name = 3;
  repeated string member_user_ids = 4;
}
message DeleteFoundryTeamRequest {
  string workspace_id = 1;
  string team_id = 2;
}
message FoundryTeamResponse {
  FoundryTeam team = 1;
}

// ListFoundryHealFindingsRequest lists an ontology's self-healing findings:
// up to 20 open ones, by support, of those backed by two documents or more
// and every row finding. NOT_FOUND for an ontology of another workspace or
// one deleted.
message ListFoundryHealFindingsRequest {
  string workspace_id = 1;
  string ontology_id = 2;
}
message ListFoundryHealFindingsResponse {
  repeated FoundryHealFinding findings = 1;
  // The ontology's latest audit, if it has had one.
  optional FoundryHealRun last_run = 2;
  // Its newest complete audit, of whichever load: whether the current load
  // was audited whole, though a later run of it is running or failed.
  optional FoundryHealRun last_complete_run = 4;
  // Whether this deployment audits loads (foundry.heal.enabled). Off, no
  // audit runs: findings and last_run stay as they were.
  bool enabled = 3;
}

// DismissFoundryHealFindingRequest dismisses an open finding by its
// fingerprint, for the caller. NOT_FOUND for a fingerprint the ontology has
// no finding of; FAILED_PRECONDITION for one superseded. One already
// dismissed is returned as it is.
message DismissFoundryHealFindingRequest {
  string workspace_id = 1;
  string ontology_id = 2;
  string fingerprint = 3;
}
message FoundryHealFindingResponse {
  FoundryHealFinding finding = 1;
}

// CreateFoundryWorkflowRequest makes a workflow of a live ontology. The same
// client_token returns the workflow it made. FAILED_PRECONDITION past
// FoundryWorkflow's cap of 100 an ontology.
message CreateFoundryWorkflowRequest {
  string workspace_id = 1;
  string ontology_id = 2;
  // 1 to 100 characters, trimmed.
  string name = 3;
  // What the agent does, at most 2,000 characters; optional.
  string description = 4;
  string client_token = 5;
}
message FoundryWorkflowResponse {
  FoundryWorkflow workflow = 1;
}

// ListFoundryWorkflowsRequest lists an ontology's workflows, newest first, 50
// a page.
message ListFoundryWorkflowsRequest {
  string workspace_id = 1;
  string ontology_id = 2;
  string page_token = 3;
}
message ListFoundryWorkflowsResponse {
  repeated FoundryWorkflow workflows = 1;
  string next_page_token = 2;
}
message GetFoundryWorkflowRequest {
  string workspace_id = 1;
  string ontology_id = 2;
  string id = 3;
}

// DeleteFoundryWorkflowRequest deletes a workflow with its runs and what
// they recorded. Calls that name one of its runs afterwards are NOT_FOUND.
message DeleteFoundryWorkflowRequest {
  string workspace_id = 1;
  string ontology_id = 2;
  string id = 3;
}

// StartFoundryWorkflowRunRequest opens a run of a workflow: its id is what
// the agent passes as workflow_run_id to the calls it makes for the run. The
// same client_token returns the run it opened. A workflow keeps its newest
// 1,000 runs: starting one past that deletes the oldest.
message StartFoundryWorkflowRunRequest {
  string workspace_id = 1;
  string ontology_id = 2;
  string workflow_id = 3;
  // The run's initial request, at most 64 KiB; optional here, when the
  // agent sends it with its answer instead.
  string input = 4;
  string client_token = 5;
}
message FoundryWorkflowRunResponse {
  FoundryWorkflowRun run = 1;
}

// GetFoundryWorkflowInsightsRequest reads what the runs an ontology's
// workflows started in the last `days` days (1 to 90; 30 when 0) came to,
// by UTC day: of one workflow when workflow_id names one, else of them all,
// and only those `started_by` started when it names a user or a service
// credential. A grantee holding part of the ontology reads only its own.
message GetFoundryWorkflowInsightsRequest {
  string workspace_id = 1;
  string ontology_id = 2;
  string workflow_id = 3;
  int32 days = 4;
  FoundryPrincipal started_by = 5;
}

// ListFoundryWorkflowRunsRequest lists a workflow's runs, newest first, 50 a
// page, without their accesses, and with their input and output cut to 500
// characters (GetFoundryWorkflowRun returns them whole).
message ListFoundryWorkflowRunsRequest {
  string workspace_id = 1;
  string ontology_id = 2;
  string workflow_id = 3;
  string page_token = 4;
}
message ListFoundryWorkflowRunsResponse {
  repeated FoundryWorkflowRun runs = 1;
  string next_page_token = 2;
}
message GetFoundryWorkflowRunRequest {
  string workspace_id = 1;
  string ontology_id = 2;
  string workflow_id = 3;
  string id = 4;
}

// FinishFoundryWorkflowRunRequest closes an open run with its answer: it
// records nothing more. Finishing a finished run again with the same input
// and output returns it; with others, FAILED_PRECONDITION.
message FinishFoundryWorkflowRunRequest {
  string workspace_id = 1;
  string ontology_id = 2;
  string workflow_id = 3;
  string id = 4;
  // The run's initial request, at most 64 KiB: required unless the run was
  // started with it, and then, if sent, the same.
  string input = 5;
  // The agent's final answer, 1 byte to 256 KiB.
  string output = 6;
}

// ListFoundryWorkflowRunAccessesRequest returns up to 100 of a run's
// accesses after after_seq, in order, fewer once their reads and results
// pass 2 MiB (always at least one).
message ListFoundryWorkflowRunAccessesRequest {
  string workspace_id = 1;
  string ontology_id = 2;
  string workflow_id = 3;
  string id = 4;
  int32 after_seq = 5;
}
message ListFoundryWorkflowRunAccessesResponse {
  repeated FoundryWorkflowAccess accesses = 1;
  // Whether accesses follow the last one returned.
  bool more = 2;
}

// AssessFoundryWorkflowRunRequest queues a finished run's assessment again,
// keeping what earlier ones spent. FAILED_PRECONDITION where assessments are
// off, for an open run, or while its assessment is queued or running.
message AssessFoundryWorkflowRunRequest {
  string workspace_id = 1;
  string ontology_id = 2;
  string workflow_id = 3;
  string id = 4;
}

// SendFoundryAgentMessageRequest queues a person's message in their thread,
// or in a new one when thread_id is empty, or their answers to the
// questions their thread's newest turn asked them. The same client_token
// returns the turn it queued. A thread with a live turn, or an action
// running, is FAILED_PRECONDITION (reason FOUNDRY_AGENT_THREAD_BUSY); the
// user's hourly messages and answers RESOURCE_EXHAUSTED; the month's budget
// FAILED_PRECONDITION.
message SendFoundryAgentMessageRequest {
  string workspace_id = 1;
  // Required with answers: the thread of the turn they answer.
  string thread_id = 2;
  oneof input {
    // At most 4,000 characters.
    string text = 3;
    // Answers to the questions answers.turn_id asked, which must be the
    // thread's newest turn, done, having asked (FAILED_PRECONDITION, reason
    // FOUNDRY_AGENT_QUESTIONS_CLOSED, once anything followed it, its answers
    // among them). Checked against its questions as AgentQuestionAnswer
    // says, every blocking one answered (INVALID_ARGUMENT otherwise).
    // Answers to a relayed generation's questions are sent to it first, as
    // the caller (answer_generation_questions, use_defaults when any is left
    // out), while it still waits on that round: else FAILED_PRECONDITION,
    // reason FOUNDRY_AGENT_QUESTIONS_CLOSED. A refusal of the send (the
    // caller may not answer it) is FAILED_PRECONDITION and queues nothing; a
    // refusal of the turn after it says the answers reached the draft.
    FoundryAgentAnswers answers = 6;
  }
  FoundryAgentPageContext page_context = 4;
  // At most 64 characters.
  string client_token = 5;
}
message FoundryAgentTurnResponse {
  FoundryAgentTurn turn = 1;
  FoundryAgentThread thread = 2;
}
// ListFoundryAgentThreadsRequest lists the caller's threads, most recently
// active first, 50 a page.
message ListFoundryAgentThreadsRequest {
  string workspace_id = 1;
  string page_token = 2;
}
message ListFoundryAgentThreadsResponse {
  repeated FoundryAgentThread threads = 1;
  string next_page_token = 2;
}
message GetFoundryAgentThreadRequest {
  string workspace_id = 1;
  string id = 2;
}
// FoundryAgentThreadResponse is a thread with its newest 100 turns, oldest
// first, and every action the agent prepared in it.
message FoundryAgentThreadResponse {
  FoundryAgentThread thread = 1;
  repeated FoundryAgentTurn turns = 2;
  repeated FoundryAgentAction actions = 3;
}
// DeleteFoundryAgentThreadRequest deletes the caller's thread, cancelling its
// live turn.
message DeleteFoundryAgentThreadRequest {
  string workspace_id = 1;
  string id = 2;
}
// ListFoundryAgentTurnEventsRequest returns up to 200 events after after_seq.
message ListFoundryAgentTurnEventsRequest {
  string workspace_id = 1;
  string id = 2;
  int32 after_seq = 3;
}
message ListFoundryAgentTurnEventsResponse {
  repeated FoundryAgentEvent events = 1;
  // The turn's status when read: once it is not queued or running and the
  // events reach last_seq, none follows.
  string status = 2;
  int32 last_seq = 3;
}
// CancelFoundryAgentTurnRequest ends the caller's queued or running turn. One
// that ended otherwise is FAILED_PRECONDITION.
message CancelFoundryAgentTurnRequest {
  string workspace_id = 1;
  string id = 2;
}
// ExecuteFoundryAgentActionRequest runs the caller's prepared action once,
// for the payload they were shown (payload_hash), authorized again as the
// caller. A thread with a live turn is FAILED_PRECONDITION (reason
// FOUNDRY_AGENT_THREAD_BUSY), as are an action that isn't prepared
// (FOUNDRY_AGENT_ACTION_NOT_PREPARED), another payload
// (FOUNDRY_AGENT_ACTION_CHANGED) and an expired confirmation
// (FOUNDRY_AGENT_ACTION_EXPIRED: refresh it). The action then ends
// succeeded, failed or unknown, and the agent goes on from it in a new turn
// (continuation).
message ExecuteFoundryAgentActionRequest {
  string workspace_id = 1;
  string id = 2;
  string payload_hash = 3;
}
// RefreshFoundryAgentActionRequest prepares the caller's expired (or
// prepared) action again as the caller, with no model call.
message RefreshFoundryAgentActionRequest {
  string workspace_id = 1;
  string id = 2;
}
// DismissFoundryAgentActionRequest records the caller's no; no turn starts.
message DismissFoundryAgentActionRequest {
  string workspace_id = 1;
  string id = 2;
}
message FoundryAgentActionResponse {
  FoundryAgentAction action = 1;
  // The turn the agent goes on from the action's result in; unset unless it ran.
  FoundryAgentTurn continuation = 2;
}
message GetFoundryAgentRuntimeRequest {
  string workspace_id = 1;
}
// UpdateFoundryAgentRuntimeRequest sets the runtime the workspace's new
// threads take (a thread keeps its own): api, claude_code or codex. codex
// runs with the owner's own Codex setup, so it needs their confirmation,
// once (confirm_codex, kept as FoundryAgentRuntime.codex_confirmed_at):
// without it, codex is FAILED_PRECONDITION (reason
// FOUNDRY_AGENT_CODEX_UNCONFIRMED). A helper need not be online to choose
// one; sending in its thread then is FAILED_PRECONDITION (reason
// FOUNDRY_AGENT_HOST_OFFLINE) until it is.
message UpdateFoundryAgentRuntimeRequest {
  string workspace_id = 1;
  string runtime = 2;
  // The owner confirms what codex runs with (Settings › AI models shows it):
  // kept, so it is asked once.
  bool confirm_codex = 3;
}
message FoundryAgentRuntimeResponse {
  FoundryAgentRuntime runtime = 1;
}
// CreateFoundryAgentHostPairingRequest makes a one-time code, valid for 10
// minutes, that pairs a helper with the install: `npx
// @helixdb/foundry-agent-host pair <code>` on the owner's machine.
message CreateFoundryAgentHostPairingRequest {
  string workspace_id = 1;
}
message FoundryAgentHostPairingResponse {
  // hxp_ and 32 characters; shown once, never stored (only its SHA-256).
  string code = 1;
  google.protobuf.Timestamp expires_at = 2;
  // The command that pairs a helper with it, ready to paste.
  string command = 3;
}
// RevokeFoundryAgentHostRequest unpairs a helper: its token and the tokens of
// the turns it runs stop working at once. Revoking one already revoked
// returns it.
message RevokeFoundryAgentHostRequest {
  string workspace_id = 1;
  string id = 2;
}
message FoundryAgentHostResponse {
  FoundryAgentHost host = 1;
}

// ListFoundryDashboardsRequest lists the workspace's dashboards, pinned ones
// first, without their specs: at most foundry.dashboards' cap of them, so one
// answer holds all.
message ListFoundryDashboardsRequest {
  string workspace_id = 1;
}
message ListFoundryDashboardsResponse {
  repeated FoundryDashboard dashboards = 1;
  // Whether the caller may create one.
  bool can_create = 2;
}
message GetFoundryDashboardRequest {
  string workspace_id = 1;
  string id = 2;
}
message FoundryDashboardResponse {
  FoundryDashboard dashboard = 1;
}
// CreateFoundryDashboardRequest makes a dashboard, unpinned. The same
// client_token returns the one it made. Past the workspace's cap is
// FAILED_PRECONDITION, reason FOUNDRY_DASHBOARD_LIMIT; a spec that isn't one
// is INVALID_ARGUMENT, saying what is wrong.
message CreateFoundryDashboardRequest {
  string workspace_id = 1;
  // 1 to 120 characters.
  string name = 2;
  // At most 1,000 characters.
  string description = 3;
  // The spec: {"v": 1, "tiles": [...], "layout": {"rows": [...]}} (package
  // dashboard); empty is a dashboard with no tiles.
  string spec_json = 4;
  // 1 to 64 characters.
  string client_token = 5;
}
// UpdateFoundryDashboardRequest edits the dashboard at expected_revision: each
// field set is changed, at least one. Another revision is FAILED_PRECONDITION,
// reason FOUNDRY_DASHBOARD_CHANGED; a dashboard the caller may not edit
// (another member's, or pinned, for a member) PERMISSION_DENIED.
message UpdateFoundryDashboardRequest {
  string workspace_id = 1;
  string id = 2;
  int64 expected_revision = 3;
  optional string name = 4;
  optional string description = 5;
  optional string spec_json = 6;
}
message DeleteFoundryDashboardRequest {
  string workspace_id = 1;
  string id = 2;
}
// PinFoundryDashboardRequest pins the dashboard in every member's sidebar, or
// unpins it, at expected_revision: owners and admins only. Another revision is
// FAILED_PRECONDITION, reason FOUNDRY_DASHBOARD_CHANGED, so what is pinned is
// what its pinner saw; past the workspace's pinned cap, reason
// FOUNDRY_DASHBOARD_LIMIT.
message PinFoundryDashboardRequest {
  string workspace_id = 1;
  string id = 2;
  bool pinned = 3;
  int64 expected_revision = 4;
}
// AddFoundryDashboardQuestionVisualRequest adds an Analyst answer's query
// result, as its visual shows it, to the dashboard at expected_revision as a
// tile of its own row, last: the query the question recorded, the visual's
// kind and title (else the question's text). The question must be answered and
// record evidence_id as a query result.
message AddFoundryDashboardQuestionVisualRequest {
  string workspace_id = 1;
  string id = 2;
  int64 expected_revision = 3;
  string ontology_id = 4;
  string question_id = 5;
  // The query result, such as e2.
  string evidence_id = 6;
  // The tile reads the question's load rather than the current one.
  bool pin_load = 7;
}
// PreviewFoundryDashboardTileRequest checks a tile and reads it once, as the
// caller: the tile as a spec writes it (package dashboard).
message PreviewFoundryDashboardTileRequest {
  string workspace_id = 1;
  string tile_json = 2;
}
message PreviewFoundryDashboardTileResponse {
  // The tile as a spec would keep it.
  string tile_json = 1;
  // The load it read: the ontology's current one, or the one it pins.
  string load_id = 2;
  // Its read's outcome as ReadFoundryGraph gives it: {"ok": <the query's
  // answer>} or {"error": <why it has none>}.
  string outcome_json = 3;
  string as_of = 4;
}
// PublishFoundryDashboardRequest reads every tile as the caller, an owner or
// admin, and keeps their outputs as the dashboard's public snapshot, at its
// link: a new one the first time or once the last one expired, the same one
// when published already. The snapshot is what the publisher reads; anyone
// with the link sees it without signing in, and it changes only when
// published again. The dashboard must still be at expected_revision
// (FOUNDRY_DASHBOARD_CHANGED) and have a tile. Refusals are
// FAILED_PRECONDITION with a reason: a caller who isn't an owner or admin,
// FOUNDRY_DASHBOARD_PUBLIC_ADMIN_ONLY; a host without public links,
// FOUNDRY_DASHBOARD_PUBLIC_UNAVAILABLE; a workspace whose owner turned them
// off, FOUNDRY_DASHBOARD_PUBLIC_OFF; a tile that can't be read, or an
// ontology it read that was deleted meanwhile or is being purged of People
// enrichment's profiles, FOUNDRY_DASHBOARD_TILE_FAILED, saying which and why;
// a snapshot past its size, FOUNDRY_DASHBOARD_TOO_LARGE; an expired link
// published again with no expiry chosen, FOUNDRY_DASHBOARD_LINK_EXPIRED.
message PublishFoundryDashboardRequest {
  string workspace_id = 1;
  string id = 2;
  int64 expected_revision = 3;
  // When the link ends, from now; unset keeps a live link's own.
  FoundryDashboardLinkExpiry expiry = 4;
}
// UnpublishFoundryDashboardRequest deletes the dashboard's snapshot, so its
// link shows nothing: owners and admins only (else
// FOUNDRY_DASHBOARD_PUBLIC_ADMIN_ONLY), whether or not public links are on.
message UnpublishFoundryDashboardRequest {
  string workspace_id = 1;
  string id = 2;
}

message GetFoundryDashboardSettingsRequest {
  string workspace_id = 1;
}
// UpdateFoundryDashboardSettingsRequest turns the workspace's public
// dashboard links on or off: owners only. Off, every link of the workspace
// shows nothing at once; on again, the links not unpublished meanwhile, and
// not expired, show again.
message UpdateFoundryDashboardSettingsRequest {
  string workspace_id = 1;
  bool public_links = 2;
}
message FoundryDashboardSettingsResponse {
  FoundryDashboardSettings settings = 1;
}

// ListFoundryAutomationsRequest lists the workspace's automations, most
// recently changed first, each with its newest run and when it last failed,
// without their specs: at most foundry.automations.max_per_workspace, so one
// answer holds all. With stats_days (1 to 30), each also counts its runs of
// that many days, today included, by the days of time_zone (an IANA zone;
// UTC when empty), and the answer sums them in summary.
message ListFoundryAutomationsRequest {
  string workspace_id = 1;
  int32 stats_days = 2;
  string time_zone = 3;
}
message ListFoundryAutomationsResponse {
  repeated FoundryAutomation automations = 1;
  // Whether the caller may create one.
  bool can_create = 2;
  // Whether a notify step emails here: false on a standalone install, which
  // sends no email and records the step as skipped.
  bool email = 3;
  // The workspace's runs of the days asked for; unset without stats_days.
  FoundryAutomationRunSummary summary = 4;
}
message GetFoundryAutomationRequest {
  string workspace_id = 1;
  string id = 2;
}
message FoundryAutomationResponse {
  FoundryAutomation automation = 1;
}
// CreateFoundryAutomationRequest makes the caller's automation, waiting for
// their approval (needs_approval): it never runs until they approve it. The
// same client_token returns the one it made. A spec that isn't one is
// INVALID_ARGUMENT, saying what is wrong; a spec naming a connector,
// ontology, document set or dashboard the workspace hasn't, INVALID_ARGUMENT
// too; past the workspace's cap, FAILED_PRECONDITION, reason
// FOUNDRY_AUTOMATION_LIMIT.
message CreateFoundryAutomationRequest {
  string workspace_id = 1;
  // 1 to 120 characters.
  string name = 2;
  // At most 1,000 characters.
  string description = 3;
  // The spec: {"v": 1, "nodes": [...], "edges": [...]} (package automation).
  string spec_json = 4;
  // 1 to 64 characters.
  string client_token = 5;
}
// UpdateFoundryAutomationRequest edits the caller's automation at
// expected_revision: each field set changes, at least one. A spec that
// changes waits for its owner's approval again, stopping the automation
// until then; a name or description alone keeps it as it is. Another's
// automation is PERMISSION_DENIED; another revision FAILED_PRECONDITION,
// reason FOUNDRY_AUTOMATION_CHANGED.
message UpdateFoundryAutomationRequest {
  string workspace_id = 1;
  string id = 2;
  int64 expected_revision = 3;
  optional string name = 4;
  optional string description = 5;
  optional string spec_json = 6;
}
// DeleteFoundryAutomationRequest deletes the automation, its runs and their
// steps, cancelling a live run: its owner, or an owner or admin.
message DeleteFoundryAutomationRequest {
  string workspace_id = 1;
  string id = 2;
}
// ApproveFoundryAutomationRequest is its owner's click on the spec they read
// at expected_revision: it becomes active, its schedule firing next at its
// first time after now, an event trigger counting only work that ends from
// now. Only the owner, signed in to the site: an agent through the MCP, a
// key or a grantee is PERMISSION_DENIED. Approving an approved spec again
// changes nothing; another revision is FAILED_PRECONDITION, reason
// FOUNDRY_AUTOMATION_CHANGED.
message ApproveFoundryAutomationRequest {
  string workspace_id = 1;
  string id = 2;
  int64 expected_revision = 3;
}
// PauseFoundryAutomationRequest stops the active automation's runs (a live
// one goes on): its owner, or an owner or admin. One waiting for approval
// is FAILED_PRECONDITION, reason FOUNDRY_AUTOMATION_NOT_ACTIVE.
message PauseFoundryAutomationRequest {
  string workspace_id = 1;
  string id = 2;
}
// ResumeFoundryAutomationRequest makes the owner's paused automation active
// again, from now. One waiting for approval is FAILED_PRECONDITION, reason
// FOUNDRY_AUTOMATION_UNAPPROVED.
message ResumeFoundryAutomationRequest {
  string workspace_id = 1;
  string id = 2;
}
// RunFoundryAutomationRequest queues a run of the owner's automation now, of
// its approved spec, active or paused. The same client_token returns the run
// it queued. A live run is FAILED_PRECONDITION, reason
// FOUNDRY_AUTOMATION_BUSY; one waiting for approval,
// FOUNDRY_AUTOMATION_UNAPPROVED; the workspace's runs of the day spent,
// RESOURCE_EXHAUSTED.
message RunFoundryAutomationRequest {
  string workspace_id = 1;
  string id = 2;
  // 1 to 64 characters.
  string client_token = 3;
}
// ListFoundryAutomationRunsRequest lists the automation's runs, newest first,
// 50 a page, without their specs or steps.
message ListFoundryAutomationRunsRequest {
  string workspace_id = 1;
  string automation_id = 2;
  string page_token = 3;
}
message ListFoundryAutomationRunsResponse {
  repeated FoundryAutomationRun runs = 1;
  string next_page_token = 2;
}
// GetFoundryAutomationRunRequest returns a run with the spec it ran and its
// steps.
message GetFoundryAutomationRunRequest {
  string workspace_id = 1;
  string automation_id = 2;
  string id = 3;
}
// CancelFoundryAutomationRunRequest ends a live run cancelled, with the step
// it was running: the automation's owner, or an owner or admin. A run that
// ended otherwise is FAILED_PRECONDITION, reason FOUNDRY_AUTOMATION_RUN_ENDED.
message CancelFoundryAutomationRunRequest {
  string workspace_id = 1;
  string automation_id = 2;
  string id = 3;
}
message ListFoundryAutomationSuggestionsRequest {
  string workspace_id = 1;
  string ontology_id = 2;
}
message ListFoundryAutomationSuggestionsResponse {
  // Each kind's, kinds in their enum's order: at most 10.
  repeated FoundryAutomationSuggestion suggestions = 1;
  // Where the first workflow came from (each suggestion says its own).
  FoundryAutomationSuggestionSource source = 2;
  // Founder is writing them: these are the fallback; read again in a
  // few seconds.
  bool generating = 3;
  // The version they were written for; empty without a current version.
  string version_id = 4;
}
message FoundryAutomationRunResponse {
  FoundryAutomationRun run = 1;
}
