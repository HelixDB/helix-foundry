# Helix's distributed Slack app "Helix Foundry", dev: unlisted, Helix's own
# sandboxes only. Create or update the app from this file; slack/manifest_test.go
# keeps its scopes and events equal to what the bot needs with dev's flags
# (slack.Required with foundry.slack.feed and foundry.slack.follow on): the
# channel history the data connector and unmentioned follow-ups read.
display_information:
  name: Helix Foundry (dev)
  description: Ask your Foundry ontologies and act on them from Slack.
features:
  bot_user:
    display_name: Helix Foundry
    always_online: true
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  agent_view:
    agent_description: Answers questions from your Helix Foundry ontologies and prepares changes for you to approve.
    suggested_prompts:
      - title: What can you do?
        message: What can you do in Foundry?
      - title: Ask the data
        message: Which customers renewed last month?
oauth_config:
  redirect_urls:
    - https://dev.foundry.helix-db.com/slack/installed
    - https://local.foundry.helix-db.com:3000/slack/installed
  scopes:
    bot:
      - app_mentions:read
      - im:history
      - im:write
      - chat:write
      - assistant:write
      - users:read
      - users:read.email
      - channels:read
      - groups:read
      - mpim:read
      - channels:history
      - groups:history
settings:
  event_subscriptions:
    request_url: https://ingest.dev.helix-db.com/v1/slack/events
    bot_events:
      - app_mention
      - message.im
      - app_uninstalled
      - tokens_revoked
      - agent_session_stopped
      - message.channels
      - message.groups
      - member_joined_channel
      - member_left_channel
      - channel_left
      - group_left
      - channel_rename
      - group_rename
      - channel_deleted
      - group_deleted
      - channel_shared
      - channel_archive
      - channel_unarchive
      - group_archive
      - group_unarchive
  interactivity:
    is_enabled: true
    request_url: https://ingest.dev.helix-db.com/v1/slack/interactivity
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
