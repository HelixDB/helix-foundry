# The REST services: Go, gRPC, grpc-gateway and the OpenAPI document the
# site reads (pb/gen/openapiv2/helix/foundry/v1/foundry.swagger.json). Only
# methods with an HTTP binding get a route. The internal protos are
# generated by buf.internal.gen.yaml.
version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/helixdb/helix-foundry/backend/pb/gen/go
  disable:
    - file_option: go_package
      module: buf.build/googleapis/googleapis
plugins:
  - remote: buf.build/protocolbuffers/go:v1.35.2
    out: pb/gen/go
    opt: paths=source_relative
  - remote: buf.build/grpc/go:v1.5.1
    out: pb/gen/go
    opt: paths=source_relative,require_unimplemented_servers=false
  - remote: buf.build/grpc-ecosystem/gateway:v2.24.0
    out: pb/gen/go
    opt: paths=source_relative
  - remote: buf.build/grpc-ecosystem/openapiv2:v2.24.0
    out: pb/gen/openapiv2
inputs:
  - directory: pb/proto
    paths:
      - pb/proto/helix/foundry
