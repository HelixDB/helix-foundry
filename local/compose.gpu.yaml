# Ollama (the ollama profile) on this machine's NVIDIA GPUs. Needs the NVIDIA
# Container Toolkit. From local/:
#   docker compose -f compose.yaml -f compose.gpu.yaml --profile ollama up -d
# or COMPOSE_FILE=compose.yaml:compose.gpu.yaml and COMPOSE_PROFILES=ollama
# in local/.env, read when Compose runs from local/.
services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
