# Ollama (the ollama profile) on this machine's NVIDIA GPUs. Needs the NVIDIA
# Container Toolkit. setup.sh adds it when it finds Docker's NVIDIA runtime,
# as COMPOSE_FILE=compose.yaml:compose.gpu.yaml in .env; by hand:
#   docker compose -f compose.yaml -f compose.gpu.yaml up -d
services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
