# The backend's fast checks, on every change so they can be a required
# check: build, vet, gofmt, golangci-lint and generated code. backend.yml
# runs its tests and builds its image on changes to backend/.
name: Backend check
on:
  push:
  pull_request:
permissions:
  contents: read
# A newer push to the same pull request cancels the run it replaces.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    working-directory: backend
jobs:
  # A branch protection check: named apart from the site CI's `check`.
  backend-check:
    runs-on: crucible-4vcpu-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # buf breaking compares with the pull request's base.
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go build ./...
      - run: go vet ./...
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      # Built with this job's Go, so it accepts the module's Go version.
      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.62.2
          "$(go env GOPATH)/bin/golangci-lint" run --timeout 5m ./...
      # The generated code is committed: regenerating it changes nothing.
      - name: generated code
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.47.2
          buf="$(go env GOPATH)/bin/buf"
          "$buf" generate
          "$buf" generate --template buf.internal.gen.yaml
          changed=$(git status --porcelain -- pb/gen)
          if [ -n "$changed" ]; then echo "$changed"; exit 1; fi
      # Hosted Helix and older sites call these protos: a change keeps what
      # they rely on. The agent's contract moves with its own version.
      - name: buf breaking
        if: github.event_name == 'pull_request'
        run: |
          "$(go env GOPATH)/bin/buf" breaking --against "../.git#ref=refs/remotes/origin/${GITHUB_BASE_REF},subdir=backend" --exclude-path pb/proto/ontology_agent
