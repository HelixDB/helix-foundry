name: CI
on: [push, pull_request]
permissions:
  contents: read
# A newer push to the same pull request cancels the run it replaces.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: crucible-4vcpu-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # tsc's incremental state (tsconfig.json sets "incremental") and the
      # ESLint and Prettier caches, kept from the last green run. The key
      # holds the OS and architecture, the lockfile and the tools' configs,
      # so a change to any of them starts from empty caches. Every tool
      # re-hashes each file's content against its entry, so a stale entry
      # only costs time; delete this step and the --cache flags to go back.
      - uses: actions/cache@v4
        with:
          path: |
            tsconfig.tsbuildinfo
            .eslintcache
            .prettiercache
          key: check-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'package.json', 'tsconfig.json', 'eslint.config.mjs', '.prettierignore') }}-${{ github.sha }}
          restore-keys: check-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'package.json', 'tsconfig.json', 'eslint.config.mjs', '.prettierignore') }}-
      - run: pnpm typecheck
      # `pnpm lint`, with each tool's cache. ESLint's cache is sound only
      # while no rule is type-aware (no parserOptions.project or
      # projectService): drop its --cache flags if typed linting is added.
      - run: pnpm exec eslint . --max-warnings 0 --cache --cache-strategy content --cache-location .eslintcache
      - run: pnpm exec prettier --check . --cache --cache-strategy content --cache-location .prettiercache
      # One worker per vCPU: Vitest's default leaves one idle, which is half
      # of a 2-vCPU runner.
      - run: pnpm test --maxWorkers=100%
  # The suite runs serially within one server set (playwright.config.ts: the
  # mock WFE holds one shared state), so it is split across machines instead:
  # each shard starts its own mock and app servers.
  e2e-shard:
    name: e2e (shard ${{ matrix.shard }}/4)
    runs-on: crucible-4vcpu-arm
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Next.js's build cache for the two e2e builds (their NEXT_DIST_DIR in
      # playwright.config.ts), kept from the last run on the same lockfile.
      - uses: actions/cache@v4
        with:
          path: |
            .next-e2e/cache
            .next-e2e-local/cache
          key: next-e2e-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: next-e2e-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}-
      # Builds the app against the mock WFE: no secrets needed.
      - run: pnpm e2e --shard=${{ matrix.shard }}/4
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report
            test-results
          retention-days: 7
  # The required `e2e` check: green only when every shard is.
  e2e:
    needs: e2e-shard
    if: always()
    runs-on: crucible-2vcpu-arm
    steps:
      - run: test "${{ needs.e2e-shard.result }}" = success
