name: CI
on: [push, pull_request]
jobs:
  # Also on a Crucible runner while it is tried: `check (crucible)` beside the
  # required `check`, which a Crucible failure never cancels.
  check:
    name: ${{ matrix.runner == 'crucible-2vcpu-arm' && 'check (crucible)' || 'check' }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, crucible-2vcpu-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Builds the app against the mock WFE: no secrets needed.
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
