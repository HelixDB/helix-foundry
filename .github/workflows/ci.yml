name: CI
on: [push, pull_request]
# Each job also runs on a Crucible runner while it is tried, as
# `<job> (crucible)`: the required checks keep their names on GitHub's
# runners, and a Crucible failure never cancels them.
jobs:
  check:
    name: check${{ matrix.suffix }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
          - runner: crucible-2vcpu-arm
            suffix: " (crucible)"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
  e2e:
    name: e2e${{ matrix.suffix }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
          - runner: crucible-2vcpu-arm
            suffix: " (crucible)"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Builds the app against the mock WFE: no secrets needed.
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report${{ matrix.suffix }}
          path: |
            playwright-report
            test-results
          retention-days: 7
