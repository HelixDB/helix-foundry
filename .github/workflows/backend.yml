# The backend's slow jobs: its tests against MySQL and PostgreSQL, and its
# image, on changes to backend/. backend-check.yml runs the fast checks on
# every change.
name: Backend
on:
  push:
    paths:
      - backend/**
      - .github/workflows/backend.yml
  pull_request:
    paths:
      - backend/**
      - .github/workflows/backend.yml
permissions:
  contents: read
defaults:
  run:
    working-directory: backend
# Each job also runs on a Crucible runner while it is tried, as
# `<job> (crucible)`; a Crucible failure never cancels GitHub's run.
jobs:
  test:
    name: test${{ matrix.suffix }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
          - runner: crucible-4vcpu-arm
            suffix: " (crucible)"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      # MySQL on 3307 (and with GTIDs on 3309) and PostgreSQL on 5433, where
      # the tests look for them.
      - run: docker compose -f compose.test.yaml up -d --wait
      - run: go test -timeout 80m ./...
        env:
          HELIX_TEST_ROOT_DSN: root:helix@tcp(127.0.0.1:3307)/
  image:
    name: image${{ matrix.suffix }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
          - runner: crucible-4vcpu-arm
            suffix: " (crucible)"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: docker build --tag helix-foundry/foundry:ci .
