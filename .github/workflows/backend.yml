# The backend's slow jobs: its tests against MySQL and PostgreSQL, and its
# image, on changes to backend/. backend-check.yml runs the fast checks on
# every change.
name: Backend
on:
  push:
    paths:
      - backend/**
      - .github/workflows/backend.yml
  pull_request:
    paths:
      - backend/**
      - .github/workflows/backend.yml
permissions:
  contents: read
# A newer push to the same pull request cancels the run it replaces.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    working-directory: backend
jobs:
  test:
    # On GitHub's runner until Crucible's guest DNS answers NXDOMAIN for names that do not exist:
    # connector's TestS3Security expects bucket.nonexistent.invalid to fail DNS, and Crucible's VM
    # resolves every name to an address its egress proxy serves.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      # MySQL on 3307 (and with GTIDs on 3309) and PostgreSQL on 5433, where
      # the tests look for them.
      - run: docker compose -f compose.test.yaml up -d --wait
      - run: go test -timeout 80m ./...
        env:
          HELIX_TEST_ROOT_DSN: root:helix@tcp(127.0.0.1:3307)/
  image:
    runs-on: crucible-4vcpu-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: docker build --tag helix-foundry/foundry:ci .
