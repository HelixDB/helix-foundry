# The backend's standalone image (backend/Dockerfile), the image
# local/compose.yaml runs as `foundry`. Each architecture is built on its own
# runner and started once, over MySQL and an S3-compatible store.
#
#   pull_request       build and start, publish nothing
#   workflow_dispatch  the same; with release_version, then publish exactly the
#                      tested images as ghcr.io/helixdb/foundry:<version>
#                      and :latest, from the default branch, refusing a
#                      version that is already published
#
# backend.yml builds the image on every change to backend/.
name: Foundry image

on:
  pull_request:
    paths:
      - ".github/workflows/foundry-image.yml"
      - "backend/Dockerfile"
      - "backend/go.mod"
      - "backend/go.sum"
      - "backend/cmd/foundry/**"
  workflow_dispatch:
    inputs:
      release_version:
        description: "Publish the tested images under this new version (for example 0.1.0); empty builds and tests only"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: foundry-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_REPOSITORY: ghcr.io/helixdb/foundry

jobs:
  image:
    name: Image (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - architecture: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CI_IMAGE: foundry:ci-${{ matrix.architecture }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: ${{ matrix.platform }}
          tags: ${{ env.CI_IMAGE }}
          load: true
          push: false
          provenance: false
          labels: |
            org.opencontainers.image.title=Helix Foundry backend
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha,scope=foundry-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=foundry-${{ matrix.architecture }}
      # The image's own health check fetches /readyz, which answers once
      # foundry has migrated its database, made its bucket and started every
      # part. So it starts on MySQL and SeaweedFS as local/compose.yaml runs
      # them, with the secrets the compose file passes, and then answers the
      # site's first call. HelixDB and the ontology agent are called only
      # later.
      - name: Start it
        run: |
          set -euo pipefail
          token=$(openssl rand -hex 32)
          s3_secret=$(openssl rand -hex 32)
          # local/compose.yaml's store and its one identity, its S3 API on the
          # network.
          printf '{"identities":[{"name":"foundry","credentials":[{"accessKey":"foundry","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' \
            "$s3_secret" > "$RUNNER_TEMP/s3.json"
          docker network create foundry
          docker run -d --name mysql --network foundry \
            -e MYSQL_RANDOM_ROOT_PASSWORD=yes -e MYSQL_DATABASE=helix \
            -e MYSQL_USER=helix -e MYSQL_PASSWORD=helix \
            mysql:8.0 --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
          docker run -d --name storage --network foundry -v "$RUNNER_TEMP/s3.json:/etc/s3.json:ro" \
            --entrypoint weed chrislusf/seaweedfs:4.47 server -dir=/data -ip=127.0.0.1 -ip.bind=127.0.0.1 \
            -s3 -s3.ip.bind=0.0.0.0 -s3.port=8333 -s3.config=/etc/s3.json
          for _ in $(seq 60); do
            docker exec mysql mysqladmin ping -h 127.0.0.1 -uhelix -phelix --silent >/dev/null 2>&1 &&
              docker exec storage nc -z 127.0.0.1 8333 && break
            sleep 2
          done
          docker exec mysql mysqladmin ping -h 127.0.0.1 -uhelix -phelix --silent >/dev/null 2>&1 || { docker logs mysql; exit 1; }
          docker exec storage nc -z 127.0.0.1 8333 || { docker logs storage; exit 1; }
          docker run -d --name foundry --network foundry -p 127.0.0.1:8081:8081 \
            -e 'HELIX_DB_DSN=helix:helix@tcp(mysql:3306)/helix?parseTime=true&multiStatements=true' \
            -e HELIX_LOCAL__SITE_TOKEN="$token" \
            -e HELIX_LOCAL__S3__ENDPOINT=http://storage:8333 \
            -e HELIX_LOCAL__S3__SECRET_ACCESS_KEY="$s3_secret" \
            -e HELIX_FOUNDRY__CONNECTORS__CURRENT_KEY="$(openssl rand -base64 32)" \
            "$CI_IMAGE"
          for _ in $(seq 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' foundry)" = healthy ] && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' foundry | grep -qx healthy || { docker logs foundry; exit 1; }
          curl -fsS -o /dev/null -H "Authorization: Bearer $token" http://127.0.0.1:8081/v1/whoami
          docker rm -f foundry storage mysql
      - name: Save the tested image
        if: github.event_name == 'workflow_dispatch' && inputs.release_version != ''
        run: docker save "$CI_IMAGE" | gzip > image-${{ matrix.architecture }}.tar.gz
      - name: Upload the tested image
        if: github.event_name == 'workflow_dispatch' && inputs.release_version != ''
        uses: actions/upload-artifact@v4
        with:
          name: tested-image-${{ matrix.architecture }}
          path: image-${{ matrix.architecture }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish the tested images
    if: github.event_name == 'workflow_dispatch' && inputs.release_version != ''
    needs: [image]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_VERSION: ${{ inputs.release_version }}
    steps:
      - uses: docker/setup-buildx-action@v3
      - name: Check the source and version
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]] || { echo "Releases come from the default branch" >&2; exit 1; }
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "The version must be MAJOR.MINOR.PATCH" >&2; exit 1; }
          repo=${IMAGE_REPOSITORY#ghcr.io/}
          token=$(curl -fsS --user "$GITHUB_ACTOR:$GH_TOKEN" "https://ghcr.io/token?service=ghcr.io&scope=repository:$repo:pull" | jq -er '.token')
          echo "::add-mask::$token"
          status=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json' \
            "https://ghcr.io/v2/$repo/manifests/$RELEASE_VERSION")
          [[ "$status" == 404 ]] || { echo "Version $RELEASE_VERSION is not confirmed absent (HTTP $status)" >&2; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          pattern: tested-image-*
          path: tested-images
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          refs=()
          for arch in amd64 arm64; do
            docker load --input "tested-images/image-$arch.tar.gz"
            ref="$IMAGE_REPOSITORY:release-$GITHUB_SHA-$GITHUB_RUN_ID-$arch"
            docker tag "foundry:ci-$arch" "$ref"
            docker push "$ref"
            digest=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' | jq -er '.digest')
            refs+=("$IMAGE_REPOSITORY@$digest")
          done
          docker buildx imagetools create --tag "$IMAGE_REPOSITORY:$RELEASE_VERSION" "${refs[@]}"
          docker buildx imagetools inspect "$IMAGE_REPOSITORY:$RELEASE_VERSION" --raw |
            jq -e '[.manifests[].platform | .os + "/" + .architecture] | sort == ["linux/amd64", "linux/arm64"]'
          docker buildx imagetools create --tag "$IMAGE_REPOSITORY:latest" "$IMAGE_REPOSITORY:$RELEASE_VERSION"
