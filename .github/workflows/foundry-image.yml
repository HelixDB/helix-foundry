# The backend's standalone image (backend/Dockerfile), the image
# local/compose.yaml runs as `foundry`. Each architecture is built on its own
# runner and started once, over MySQL and an S3-compatible store.
#
#   pull_request       build and start, publish nothing
#   workflow_dispatch  the same; with release_version, then publish exactly the
#                      tested images as ghcr.io/helixdb/foundry:<version>
#                      and :latest, from the default branch, refusing a
#                      version that is already published
#
# backend.yml builds the image on every change to backend/.
name: Foundry image

on:
  pull_request:
    paths:
      - ".github/workflows/foundry-image.yml"
      - "backend/Dockerfile"
      - "backend/go.mod"
      - "backend/go.sum"
      - "backend/cmd/foundry/**"
  workflow_dispatch:
    inputs:
      release_version:
        description: "Publish the tested images under this new version (for example 0.1.0); empty builds and tests only"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: foundry-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_REPOSITORY: ghcr.io/helixdb/foundry

jobs:
  image:
    name: Image (${{ matrix.architecture }}${{ matrix.crucible && ', crucible' || '' }})
    strategy:
      fail-fast: false
      # amd64 and arm64 on GitHub's runners and, unless releasing, arm64 on a
      # Crucible runner too while it is tried: a release never waits on it.
      matrix:
        include: >-
          ${{ fromJSON(!inputs.release_version
          && '[{"architecture":"amd64","platform":"linux/amd64","runner":"ubuntu-24.04"},{"architecture":"arm64","platform":"linux/arm64","runner":"ubuntu-24.04-arm"},{"architecture":"arm64","platform":"linux/arm64","runner":"crucible-2vcpu-arm","crucible":true}]'
          || '[{"architecture":"amd64","platform":"linux/amd64","runner":"ubuntu-24.04"},{"architecture":"arm64","platform":"linux/arm64","runner":"ubuntu-24.04-arm"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CI_IMAGE: foundry:ci-${{ matrix.architecture }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: ${{ matrix.platform }}
          tags: ${{ env.CI_IMAGE }}
          load: true
          push: false
          provenance: false
          labels: |
            org.opencontainers.image.title=Helix Foundry backend
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha,scope=foundry-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=foundry-${{ matrix.architecture }}
      # The image's own health check fetches /readyz, which answers once
      # foundry has migrated its database, made its bucket and started every
      # part. So it starts as local/compose.yaml runs it, with nothing set
      # up: its own init-secrets writes the secrets into a volume (and keeps
      # them when run again), MySQL and SeaweedFS read theirs from it, and
      # foundry the rest, then answers the site's first call with the
      # workspace it made. HelixDB and the ontology agent are called only
      # later.
      - name: Start it
        run: |
          set -euo pipefail
          docker volume create secrets
          for _ in 1 2; do
            docker run --rm --user 0:0 --network none -v secrets:/secrets "$CI_IMAGE" \
              init-secrets --dir /secrets --owner 65532:65532 --reader site-token=1000 --reader mysql-password=999
          done
          docker network create foundry
          docker run -d --name mysql --network foundry -v secrets:/secrets:ro \
            -e MYSQL_RANDOM_ROOT_PASSWORD=yes -e MYSQL_DATABASE=helix \
            -e MYSQL_USER=helix -e MYSQL_PASSWORD_FILE=/secrets/mysql-password \
            mysql:8.0 --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
          # local/compose.yaml's store and its one identity, its S3 API on the
          # network.
          docker run -d --name storage --network foundry -v secrets:/secrets:ro \
            --entrypoint /bin/sh chrislusf/seaweedfs:4.47 -c \
            'printf '"'"'{"identities":[{"name":"foundry","credentials":[{"accessKey":"foundry","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'"'"' "$(cat /secrets/s3-secret)" > /tmp/s3.json &&
              exec weed server -dir=/data -ip=127.0.0.1 -ip.bind=127.0.0.1 -s3 -s3.ip.bind=0.0.0.0 -s3.port=8333 -s3.config=/tmp/s3.json'
          mysql_up() { docker exec mysql sh -c 'mysqladmin ping -h 127.0.0.1 -uhelix -p"$(cat /secrets/mysql-password)" --silent' >/dev/null 2>&1; }
          for _ in $(seq 60); do
            mysql_up && docker exec storage nc -z 127.0.0.1 8333 && break
            sleep 2
          done
          mysql_up || { docker logs mysql; exit 1; }
          docker exec storage nc -z 127.0.0.1 8333 || { docker logs storage; exit 1; }
          docker run -d --name foundry --network foundry -p 127.0.0.1:8081:8081 -v secrets:/secrets:ro \
            -e 'HELIX_DB_DSN=helix@tcp(mysql:3306)/helix?parseTime=true&multiStatements=true' \
            -e HELIX_LOCAL__SECRETS_DIR=/secrets \
            -e HELIX_LOCAL__S3__ENDPOINT=http://storage:8333 \
            "$CI_IMAGE"
          for _ in $(seq 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' foundry)" = healthy ] && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' foundry | grep -qx healthy || { docker logs foundry; exit 1; }
          # As the site reads it, as its user (node, 1000), whose group the file is.
          token=$(docker run --rm --user 1000:1000 -v secrets:/secrets:ro --entrypoint cat "$CI_IMAGE" /secrets/site-token)
          echo "::add-mask::$token"
          curl -fsS -H "Authorization: Bearer $token" http://127.0.0.1:8081/v1/whoami |
            jq -e '.workspaces | length == 1' >/dev/null
          docker rm -f foundry storage mysql
      - name: Save the tested image
        if: github.event_name == 'workflow_dispatch' && inputs.release_version != ''
        run: docker save "$CI_IMAGE" | gzip > image-${{ matrix.architecture }}.tar.gz
      - name: Upload the tested image
        if: github.event_name == 'workflow_dispatch' && inputs.release_version != ''
        uses: actions/upload-artifact@v4
        with:
          name: tested-image-${{ matrix.architecture }}
          path: image-${{ matrix.architecture }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish the tested images
    if: github.event_name == 'workflow_dispatch' && inputs.release_version != ''
    needs: [image]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_VERSION: ${{ inputs.release_version }}
    steps:
      - uses: docker/setup-buildx-action@v3
      - name: Check the source and version
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]] || { echo "Releases come from the default branch" >&2; exit 1; }
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "The version must be MAJOR.MINOR.PATCH" >&2; exit 1; }
          repo=${IMAGE_REPOSITORY#ghcr.io/}
          token=$(curl -fsS --user "$GITHUB_ACTOR:$GH_TOKEN" "https://ghcr.io/token?service=ghcr.io&scope=repository:$repo:pull" | jq -er '.token')
          echo "::add-mask::$token"
          status=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json' \
            "https://ghcr.io/v2/$repo/manifests/$RELEASE_VERSION")
          [[ "$status" == 404 ]] || { echo "Version $RELEASE_VERSION is not confirmed absent (HTTP $status)" >&2; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          pattern: tested-image-*
          path: tested-images
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          refs=()
          for arch in amd64 arm64; do
            docker load --input "tested-images/image-$arch.tar.gz"
            ref="$IMAGE_REPOSITORY:release-$GITHUB_SHA-$GITHUB_RUN_ID-$arch"
            docker tag "foundry:ci-$arch" "$ref"
            docker push "$ref"
            digest=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' | jq -er '.digest')
            refs+=("$IMAGE_REPOSITORY@$digest")
          done
          docker buildx imagetools create --tag "$IMAGE_REPOSITORY:$RELEASE_VERSION" "${refs[@]}"
          docker buildx imagetools inspect "$IMAGE_REPOSITORY:$RELEASE_VERSION" --raw |
            jq -e '[.manifests[].platform | .os + "/" + .architecture] | sort == ["linux/amd64", "linux/arm64"]'
          docker buildx imagetools create --tag "$IMAGE_REPOSITORY:latest" "$IMAGE_REPOSITORY:$RELEASE_VERSION"
